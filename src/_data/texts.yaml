# Oyun metinleri (works.yaml'daki text alanlarının yerine geçer). Akan, bağlantılı dil.
yakin:
  tr: |
    Bir yakınlık ne zaman bağımlılığa dönüşür? YAKIN, bir ilişkinin içinde insanın yavaş yavaş ölçülmeye, kıyaslanmaya ve sonunda kendini karşısındakine göre ayarlamaya başladığı o sessiz kaymayı anlatıyor; karşımızdaki bir sevgili mi, yoksa bizi bizden iyi tanıyan bir yanılsama mı, sorusunu da sonuna kadar açık bırakıyor.

    Tek kişilik oyunu, sahneler arasında canlı söylenen şarkılar taşıyor: söylenemeyen her şey sonunda bir melodiye sığınıyor ve oyun, şarkıyla konuşmanın birbirine dönüştüğü o ince çizgide ilerliyor.
  de: |
    Wann wird Nähe zur Abhängigkeit? YAKIN erzählt von dem leisen Abgleiten innerhalb einer Beziehung, in dem man nach und nach gemessen und verglichen wird und sich schließlich ganz nach dem anderen ausrichtet, und lässt bis zuletzt offen, ob das Gegenüber ein geliebter Mensch ist oder eine Illusion, die uns besser kennt als wir selbst.

    Getragen wird dieses Solo von Liedern, die zwischen den Szenen live gesungen werden: Was sich nicht sagen lässt, sucht am Ende Zuflucht in einer Melodie, und das Stück bewegt sich auf der schmalen Linie, an der Sprechen und Singen ineinander übergehen.
  en: |
    When does closeness become dependence? YAKIN traces the quiet slide within a relationship in which one is gradually measured and compared and finally adjusts oneself entirely to the other, leaving open to the very end whether the person opposite is a lover or an illusion that knows us better than we know ourselves.

    This solo is carried by songs sung live between the scenes: whatever cannot be said finally takes refuge in a melody, and the piece moves along the thin line where speaking and singing turn into one another.

kozalar:
  tr: |
    Dışarıda dünya yanarken üç kadın kapıyı kilitliyor, kulaklarını tıkıyor ve kendi ördükleri kozalara sarılıyor. Adalet Ağaoğlu'nun 1971'de Ankara'da yazdığı oyun, gerçekçi bir çerçevenin içine absürdü yerleştirerek kendini terbiye ve edep diye sunan bir kayıtsızlığı gözler önüne seriyor.

    Karışmayanın suçlu da olmayacağına inanan bu kadınların söyledikleri, aradan elli yıl geçmesine rağmen tuhaf biçimde tanıdık geliyor. Bize ne, diyorlar; oyun da bu iki kelimenin ne kadar ağır bir yük taşıdığını soruyor.
  de: |
    Während draußen die Welt brennt, verriegeln drei Frauen die Tür, stopfen sich die Ohren zu und ziehen sich in selbstgesponnene Kokons zurück. Adalet Ağaoğlu, eine der prägenden Stimmen der modernen türkischen Literatur, schrieb das Stück 1971 in Ankara und lässt in einen realistischen Rahmen das Absurde einbrechen, um eine Gleichgültigkeit sichtbar zu machen, die sich als Anstand ausgibt.

    Diese Frauen glauben, dass sich nicht schuldig macht, wer sich nicht einmischt, und fünfzig Jahre später klingen ihre Sätze auf unheimliche Weise vertraut. Was geht uns das an, fragen sie, und das Stück fragt zurück, wie schwer diese wenigen Worte wiegen.
  en: |
    While the world burns outside, three women lock the door, block their ears and withdraw into cocoons of their own making. Adalet Ağaoğlu, one of the defining voices of modern Turkish literature, wrote the play in Ankara in 1971, letting the absurd break into a realistic frame to expose an indifference that passes itself off as decency.

    These women believe that whoever stays out of things cannot be guilty, and fifty years later their words sound uncannily familiar. What's it to us, they ask, and the play asks back how much those few words weigh.

pride-93:
  tr: |
    1993 yazında İstanbul'da küçük bir grup, Türkiye'nin ilk Onur Yürüyüşü'nü hazırlıyordu; yürüyüş daha başlamadan yasaklandı. Pride '93 seyirciyi o yasaktan önceki haftalara götürüyor: örgütlenmenin ilk denemelerine, Ülker Sokak'taki evlere, baskının ve korkunun ortasında henüz adı konmamış bir cesarete.

    Oyun, Siyah Pembe Üçgen İzmir'in sözlü tarih çalışmasında kayda geçen tanıklıklardan ve Kaos GL dergi arşivinden yola çıkarak yazıldı. 2015'ten beri İstanbul'da Onur Yürüyüşü yapılamıyor; Pride '93 da bugünü anlayabilmek için her şeyin başladığı yere geri dönüyor.
  de: |
    Im Sommer 1993 bereitete eine kleine Gruppe in Istanbul den ersten Pride der Türkei vor, doch die Parade wurde verboten, noch bevor sie beginnen konnte. Pride '93 kehrt in die Wochen davor zurück: zu den ersten Versuchen, sich zu organisieren, zu den Wohnungen in der Ülker Sokak und zu einem Mut, für den es inmitten von Repression und Angst noch keine Sprache gab.

    Das Stück entstand aus Zeitzeug*innen-Interviews, die der Verein Siyah Pembe Üçgen İzmir in seinem Oral-History-Projekt gesammelt hat, und aus dem Archiv der Zeitschrift Kaos GL. Seit 2015 kann in Istanbul kein Pride mehr stattfinden, und gerade deshalb blickt Pride '93 auf den Anfang zurück, um die Gegenwart besser zu verstehen.
  en: |
    In the summer of 1993 a small group in Istanbul was preparing Turkey's first Pride, but the march was banned before it could begin. Pride '93 takes us back to the weeks before: to the first attempts to organise, to the flats on Ülker Sokak, and to a courage that had no language yet amid repression and fear.

    The piece grew out of witness interviews collected in the oral history project of Siyah Pembe Üçgen İzmir and out of the archive of Kaos GL magazine. Since 2015 no Pride has been allowed in Istanbul, which is exactly why Pride '93 returns to the beginning in order to understand the present.

uftade:
  tr: |
    Haziran 2013'te Gezi Parkı'nın hemen yanındaki küçük bir tiyatronun sahnesi, birkaç saat içinde yaralıların ve onlara koşan doktorların sığındığı bir revire dönüştü. Üftade, direnişin ilk kırk sekiz saatini o tiyatroda çalışanların ve oraya tesadüfen düşmüş bir Alman tiyatrocunun gözünden anlatıyor.

    Başlık hem düşkün, yardıma muhtaç olan anlamına geliyor hem de tiyatronun bulunduğu sokağın adını taşıyor. 2010'larda Beyoğlu'nda gençlerin açtığı küçük sahneler o günlerde birer sığınağa dönüşmüştü; oyun, unutulmaya yüz tutmuş bu dayanışmanın kaydını tutuyor.
  de: |
    Im Juni 2013 verwandelte sich die Bühne eines kleinen Theaters direkt neben dem Gezi-Park innerhalb weniger Stunden in ein Lazarett, in dem Verletzte und die zu Hilfe eilenden Ärzt*innen Zuflucht fanden. Üftade erzählt die ersten achtundvierzig Stunden des Widerstands aus der Sicht der Menschen, die an diesem Theater arbeiteten, und eines deutschen Theatermachers, der zufällig dort gelandet war.

    Der Titel bedeutet so viel wie die Gefallene, die auf Hilfe Angewiesene, und ist zugleich der Name der Straße, in der das Theater liegt. Die kleinen Bühnen, die junge Leute in den 2010er Jahren in Beyoğlu eröffnet hatten, wurden damals zu Zufluchtsorten, und das Stück hält diese fast vergessene Solidarität fest.
  en: |
    In June 2013 the stage of a small theatre right next to Gezi Park became, within a few hours, a field hospital where the wounded and the doctors who rushed to help them found shelter. Üftade tells the first forty-eight hours of the resistance through the eyes of the people working at that theatre and of a German theatre-maker who had ended up there by chance.

    The title means the fallen, the one in need of help, and is also the name of the street where the theatre stands. The small stages young people had opened in Beyoğlu in the 2010s became refuges in those days, and the play keeps a record of a solidarity that is close to being forgotten.

yeni-bir-hayat-icin:
  tr: |
    Orta yaş krizinin tam ortasındaki Selim Özben, bir sabah artık eskisi gibi yaşamayacağına karar veriyor ve kendine yeni bir hayat kurmaya girişiyor: doğa sporları, internet, gece hayatı, sanat kursları derken her yeni uğraş ona bambaşka bir kimlik vaat ediyor.

    Ama hiçbir hobi, insanın kendisiyle ve içinde yaşadığı koşullarla yüzleşmesinin yerini tutmuyor. Cüneyt Yalaz ile Uluç Esen'in tek kişilik oyunu, orta sınıfın kendini yeniden icat etme hevesine hem güldüren hem de acıtan bir yerden bakıyor.
  de: |
    Mitten in seiner Midlife-Crisis beschließt Selim Özben eines Morgens, nicht mehr so weiterzuleben wie bisher, und macht sich daran, ein neues Leben aufzubauen: Extremsport, Internet, Nachtleben, Kunstkurse, und jede neue Beschäftigung verspricht ihm eine ganz andere Identität.

    Doch kein Hobby ersetzt die Auseinandersetzung mit sich selbst und mit den Verhältnissen, in denen man lebt. Das Solo von Cüneyt Yalaz und Uluç Esen blickt auf den Wunsch der Mittelschicht, sich neu zu erfinden, mit einem Humor, der zugleich weh tut.
  en: |
    In the middle of a midlife crisis, Selim Özben decides one morning that he will no longer live as before and sets out to build himself a new life: outdoor sports, the internet, nightlife, art classes, each new pursuit promising him a different identity.

    Yet no hobby can replace facing yourself and the conditions you live in. Cüneyt Yalaz and Uluç Esen's solo looks at the middle-class urge to reinvent itself with a humour that also hurts.

avzer:
  tr: |
    Avzer üç yaşından beri yurtta büyümüş, bir gün oradan kaçmış ve o günden beri sokakta yaşıyor. Haziran 2013'te bir sabah Kızılay'da uyandığında şehri tanıyamıyor: her yerde kalabalıklar, öfke ve daha önce hiç karşılaşmadığı bir dayanışma var.

    Şamil Yılmaz'ın metni Gezi direnişini, hiç kimsenin hesaba katmadığı birinin gözünden anlatıyor. Hayatı boyunca kenarda kalmış bir çocuk için, kamusal alan ilk kez gerçekten herkesin olduğunda neler değişir?
  de: |
    Avzer ist seit seinem dritten Lebensjahr im Heim aufgewachsen, eines Tages von dort weggelaufen und lebt seitdem auf der Straße. Als er im Juni 2013 eines Morgens am Kızılay-Platz in Ankara aufwacht, erkennt er die Stadt nicht wieder: überall Menschenmengen, Wut und eine Solidarität, die er noch nie erlebt hat.

    Der Text von Şamil Yılmaz erzählt die Gezi-Proteste aus der Sicht von jemandem, mit dem niemand gerechnet hat. Was verändert sich für ein Kind, das sein Leben lang am Rand stand, wenn der öffentliche Raum zum ersten Mal wirklich allen gehört?
  en: |
    Avzer has grown up in care since he was three, ran away one day and has lived on the street ever since. When he wakes up one morning in June 2013 on Kızılay square in Ankara, he no longer recognises the city: crowds everywhere, anger, and a solidarity he has never known.

    Şamil Yılmaz's text tells the Gezi protests through the eyes of someone nobody counted on. What changes for a child who has always lived on the margins when public space, for the first time, truly belongs to everyone?

sen-istanbuldan-daha-guzelsin:
  tr: |
    Ayfer, Başak ve Melis: büyükanne, anne ve torun. Aynı aileden gelen bu üç kadının hikâyesi İstanbul'da, yaklaşık elli yıla yayılan farklı evlerde geçiyor; her birinin içinde kimseye söylenmemiş cümleler, iç sesler ve aktarılmış sessizlikler birikmiş.

    Bu kadar kalabalık bir şehirde her yer neden bu kadar boş görünüyor? Murat Mahmutyazıcıoğlu'nun metni, kuşaktan kuşağa geçen o suskunluğun izini sürerken bir şehre duyulan aşkla bir aileye duyulan kırgınlığın nasıl iç içe geçtiğini gösteriyor.
  de: |
    Ayfer, Başak und Melis: Großmutter, Mutter und Enkelin. Die Geschichte dieser drei Frauen einer Familie spielt in Istanbul, in verschiedenen Wohnungen über rund fünfzig Jahre hinweg, und in jeder von ihnen haben sich ungesagte Sätze, innere Stimmen und weitergereichtes Schweigen angesammelt.

    Wie kann eine Stadt mit so vielen Menschen so leer wirken? Der Text von Murat Mahmutyazıcıoğlu folgt dem Schweigen, das von Generation zu Generation weitergegeben wird, und zeigt, wie sich die Liebe zu einer Stadt und die Kränkungen einer Familie ineinander verschränken.
  en: |
    Ayfer, Başak and Melis: grandmother, mother and granddaughter. The story of these three women of one family unfolds in Istanbul, across different homes over some fifty years, and in each of them unspoken sentences, inner voices and inherited silences have piled up.

    How can a city full of people seem so empty? Murat Mahmutyazıcıoğlu's text follows the silence handed down from one generation to the next and shows how love for a city and the hurts of a family become entangled.

ondan-sonra:
  tr: |
    Kulaklıklar takıldığında Berlin'in ortasında bir takip başlıyor. Seyirci, birbirini hiç tanımayan dört kişinin peşine düşüyor ve şehrin içinden geçerken onları birbirine bağlayan şeyin ne olduğunu anlamaya çalışıyor.

    Hepsinin peşinden gittiği biri var, ama o hiç görünmüyor: Hanım. Didem Kaplan'ın metni göçü, öteki olmayı ve yarım kalmış bir modernleşmeyi bugünün insanları üzerinden sorgularken Berlin'in sokaklarını oyunun sahnesine dönüştürüyor.
  de: |
    Sobald die Kopfhörer aufgesetzt sind, beginnt mitten in Berlin eine Verfolgung. Das Publikum heftet sich an die Fersen von vier Menschen, die einander nicht kennen, und versucht auf dem Weg durch die Stadt herauszufinden, was sie miteinander verbindet.

    Alle folgen sie jemandem, der nie zu sehen ist: der Dame. Didem Kaplans Text fragt anhand heutiger Lebensgeschichten nach Migration, Fremdsein und einer unvollendeten Moderne und macht die Straßen Berlins zur Bühne.
  en: |
    Once the headphones are on, a pursuit begins in the middle of Berlin. The audience follows four people who do not know each other and, walking through the city, tries to work out what connects them.

    All of them are following someone who never appears: the Lady. Didem Kaplan's text explores migration, otherness and an unfinished modernity through present-day lives and turns the streets of Berlin into the stage.

nested:
  tr: |
    Batılı imgelerle biçimlenmiş Doğu kültürlerinden gelen sanatçılar göç ettiklerinde neler olur? Geride ne bırakırlar, yeni bir şehirde kendilerine nasıl bir yer açarlar ve o yer gerçekten onların olur mu?

    Nested, Körnerpark'ın açık havasında beden, video ve ses arasında kurulan bir performans. Göçü, sürekli yeniden kurulan ve yeniden dağılan bir yuva olarak düşünüyor.
  de: |
    Was geschieht mit Künstler*innen aus östlichen Kulturen, die selbst von westlichen Bildern geprägt wurden, wenn sie migrieren? Was lassen sie zurück, wie schaffen sie sich in einer neuen Stadt einen Platz, und gehört dieser Platz am Ende wirklich ihnen?

    Nested ist eine Performance unter freiem Himmel im Körnerpark, angesiedelt zwischen Körper, Video und Klang. Sie denkt Migration als ein Nest, das immer wieder gebaut wird und immer wieder zerfällt.
  en: |
    What happens to artists from Eastern cultures, themselves shaped by Western images, when they migrate? What do they leave behind, how do they make a place for themselves in a new city, and does that place ever truly become theirs?

    Nested is an open-air performance in Körnerpark, set between body, video and sound. It thinks of migration as a nest that is built again and again and keeps falling apart.

uzak:
  tr: |
    Bergama'nın Kale Mahallesi'nde kulaklıklar takılıyor ve tek bir seyirci yola çıkıyor. Chris Marker'ın La Jetée'sinden yola çıkan Uzak, Üçüncü Dünya Savaşı'ndan sonra geçmişe ve geleceğe gönderilen bir tutsağın hikâyesini, binlerce yıllık bir mahallenin dar sokaklarına yerleştiriyor.

    Yürüdükçe şehir bir zaman makinesine dönüşüyor ve seyirci, ölümle yaşam arasında gidip gelen bir anının peşinden, amaç ve varoluş üzerine düşünerek ilerliyor.
  de: |
    In Bergamas Altstadtviertel Kale Mahallesi setzt eine einzige Person die Kopfhörer auf und macht sich auf den Weg. Ausgehend von Chris Markers La Jetée verlegt Uzak die Geschichte eines Gefangenen, der nach dem Dritten Weltkrieg in Vergangenheit und Zukunft geschickt wird, in die engen Gassen eines jahrtausendealten Viertels.

    Mit jedem Schritt wird die Stadt zur Zeitmaschine, und das Publikum folgt einer Erinnerung, die zwischen Tod und Leben pendelt, und denkt dabei über Sinn und Dasein nach.
  en: |
    In Bergama's old quarter, Kale Mahallesi, a single spectator puts on headphones and sets off. Starting from Chris Marker's La Jetée, Uzak moves the story of a prisoner sent into the past and the future after the Third World War into the narrow lanes of a neighbourhood thousands of years old.

    With every step the city becomes a time machine, and the audience follows a memory that swings between death and life, reflecting on purpose and existence along the way.

80lerde-lubunya-olmak:
  tr: |
    Bugün elli yaşında olan bir trans kadın, 1980 darbesinin gölgesinde lubunya olmanın ne anlama geldiğini anlatıyor: parklar, üçüncü sınıf oteller, gece kulüpleri, karakollar ve kışlalar, ama her şeyden önce birbirinden başka tutunacak kimsesi olmayan insanların dayanışması.

    Metin, Siyah Pembe Üçgen İzmir'in derlediği gerçek tanıklıklara dayanıyor. Seyirci salaş bir meyhanedeymiş gibi masalara oturuyor, arabesk şarkılar geceye eşlik ediyor ve resmî tarihin hiçbir zaman yazmadığı bir hayatta kalma hikâyesi, bir kadeh eşliğinde dinleniyor.
  de: |
    Eine heute fünfzigjährige trans Frau erzählt, was es bedeutete, im Schatten des Militärputsches von 1980 lubunya zu sein: Parks, drittklassige Hotels, Nachtclubs, Polizeiwachen und Kasernen, vor allem aber die Solidarität von Menschen, die außer einander niemanden hatten, an dem sie sich festhalten konnten.

    Der Text beruht auf realen Zeitzeug*innen-Interviews, die der Verein Siyah Pembe Üçgen İzmir gesammelt hat. Das Publikum sitzt wie in einer Kaschemme an Tischen, Arabesk-Lieder begleiten den Abend, und bei einem Glas hört man eine Geschichte des Überlebens, die in keiner offiziellen Chronik steht.
  en: |
    A trans woman, now fifty, tells what it meant to be lubunya in the shadow of the 1980 military coup: parks, third-rate hotels, nightclubs, police stations and barracks, but above all the solidarity of people who had no one to hold on to but each other.

    The text is based on real testimonies collected by Siyah Pembe Üçgen İzmir. The audience sits at tables as if in a run-down tavern, arabesk songs accompany the night, and over a glass you hear a story of survival that no official history has ever written down.

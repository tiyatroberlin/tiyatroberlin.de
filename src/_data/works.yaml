- slug: yeni-bir-hayat-icin
  title: Yeni Bir Hayat İçin
  year: 2023
  premiere_kind: premiere
  image: oyun/yeni-bir-hayat-icin.jpg
  form: {tr: "Tek kişilik oyun", de: "Solo", en: "Solo"}
  hook: {tr: "Orta yaş, orta sınıf, yeni bir kimlik.", de: "Mitte des Lebens, Mittelschicht, neue Identität.", en: "Midlife, middle class, a new identity."}
  text:
    tr: |
      Orta yaş krizindeki Selim Özben yeni bir hayat kurmaya karar veriyor: doğa sporları, internet, gece hayatı, sanat kursları.

      Her yeni uğraş bir kimlik vaadi taşıyor, hiçbiri yüzleşmenin yerini tutmuyor. Cüneyt Yalaz ve Uluç Esen'in tek kişilik oyunu, orta sınıfın kendini yeniden icat etme hevesine acı bir komediyle bakıyor.
    de: |
      Mitten in der Midlife-Crisis beschließt Selim Özben, ein neues Leben anzufangen: Outdoor-Sport, Internet, Nachtleben, Kunstkurse.

      Jede neue Beschäftigung verspricht eine Identität, keine ersetzt die Auseinandersetzung mit sich selbst und mit den Verhältnissen. Das Solo von Cüneyt Yalaz und Uluç Esen blickt mit bitterer Komik auf den Wunsch der Mittelschicht, sich neu zu erfinden.
    en: |
      In the middle of a midlife crisis, Selim Özben decides to start a new life: outdoor sports, the internet, nightlife, art classes.

      Each new pursuit promises an identity; none replaces facing himself and his circumstances. Cüneyt Yalaz and Uluç Esen's solo looks at the middle-class urge to reinvent itself with bitter comedy.
  credits:

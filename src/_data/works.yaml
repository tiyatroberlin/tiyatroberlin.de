- slug: 80lerde-lubunya-olmak
  title: 80'lerde Lubunya Olmak
  year: 2021
  image: foto/lubunya-eldiven-hd.jpg
  hero: foto/lubunya-eldiven-hd.jpg
  hero_fit: true
  poster: oyun/lubunya.jpg
  gallery: [foto/lubunya-sahne.jpg]
  form: {tr: "Tek kişilik performans", de: "Solo-Performance", en: "Solo performance"}
  hook: {tr: "Bir trans kadın, 1980 darbesinin gölgesinde bir hayat.", de: "Eine trans Frau, ein Leben im Schatten des Putsches von 1980.", en: "A trans woman, a life in the shadow of the 1980 coup."}
  text:
    tr: |
      Bir trans kadın, 1980 darbesinin gölgesinde lubunya olmanın tarihini anlatıyor: parklar, üçüncü sınıf oteller, gece kulüpleri, Bayram Sokak, Dolapdere, karakollar ve kışlalar.

      Metin, Siyah Pembe Üçgen İzmir'in derlediği gerçek tanıklıklara dayanıyor. Seyirci salaş bir meyhanede oturuyor, arabesk şarkılar geceye eşlik ediyor. Resmî tarihin dışında kalmış bir hayatta kalma ve dayanışma tarihi.
    de: |
      Eine trans Frau erzählt, was es hieß, im Schatten des Militärputsches von 1980 lubunya zu sein: Parks, drittklassige Hotels, Nachtclubs, Polizeiwachen und Kasernen.

      Der Text beruht auf realen Zeitzeug*innen-Interviews, die der Verein Siyah Pembe Üçgen İzmir gesammelt hat. Das Publikum sitzt wie in einer Kaschemme, Arabesk-Lieder begleiten den Abend. Eine Geschichte des Überlebens und der Solidarität, die in keiner offiziellen Chronik steht.
    en: |
      A trans woman tells what it meant to be lubunya in the shadow of the 1980 military coup: parks, third-rate hotels, nightclubs, police stations and barracks.

      The text is based on real testimonies collected by Siyah Pembe Üçgen İzmir. The audience sits as if in a run-down tavern, arabesk songs accompany the night. A history of survival and solidarity that no official record holds.
  credits:

- slug: yakin
  title: YAKIN
  year: 2026
  image: foto/yakin-yuz.jpg
  hero_fit: true
  teaser: {video: video/yakin-teaser.mp4, poster: video/yakin-teaser.jpg}
  form: {tr: "Tek kişilik oyun, şarkılarla", de: "Solo mit Liedern", en: "Solo with songs"}
  hook: {tr: "Yakınlık bir bağımlılığa dönüşürse?", de: "Wenn Nähe zur Abhängigkeit wird.", en: "When closeness turns into dependence."}
  text:
    tr: |
      Bir yakınlık ne zaman bağımlılığa dönüşür? Karşımızdaki bir sevgili mi, yoksa bizi bizden iyi tanıyan bir yanılsama mı?

      YAKIN, sahneler arasında canlı söylenen şarkılarla ilerleyen tek kişilik bir oyun. Şarkılar hikâyeyi süslemiyor, onu taşıyor: söylenemeyen her şey bir melodiye sığınıyor.
    de: |
      Wann wird Nähe zur Abhängigkeit? Ist das Gegenüber ein geliebter Mensch oder eine Illusion, die uns besser kennt als wir selbst?

      YAKIN ist ein Solo, das von live gesungenen Liedern getragen wird. Die Lieder schmücken die Geschichte nicht aus, sie tragen sie: Was sich nicht sagen lässt, sucht Zuflucht in einer Melodie.
    en: |
      When does closeness become dependence? Is the person opposite us a lover, or an illusion that knows us better than we know ourselves?

      YAKIN is a solo carried by songs sung live between the scenes. The songs do not decorate the story, they carry it: whatever cannot be said takes refuge in a melody.
  credits:
    - [writedirect, ufuk-tan-altunkaya]
    - [songs, hazal-erdal]
  shows:
    - {date: 2026-11-22, time: "19:00", venue: moda-bar, premiere: true, eventim: 6ace5a69a47cb7abb7b2496e, price: {tr: "20 €", de: "20 €", en: "€20"}}
    - {date: 2026-11-29, time: "19:00", venue: moda-bar, eventim: 6ace5aa484ed3c6a8a6549e6, price: {tr: "20 €", de: "20 €", en: "€20"}}

- slug: zwei-staedte-ein-koerper
  title: Zwei Städte, Ein Körper
  image: oyun/zwei-staedte.jpg
  poster: oyun/zwei-staedte.jpg
  year: 2026
  form: {tr: "Mekâna özgü kulaklıklı yürüyüş", de: "Ortsspezifischer Audiowalk", en: "Site-specific audio walk"}
  info: {tr: "Proud Haram Festivali 2026 programında. Almanca.", de: "Im Rahmen des Proud Haram Festivals 2026. Auf Deutsch.", en: "Part of Proud Haram Festival 2026. In German."}
  text:
    tr: |
      Zwei Städte, Ein Körper, Wedding'deki Ballhaus Prinzenallee'den yola çıkan ve seyircinin kulaklıktaki seslere eşlik ederek yürüdüğü mekâna özgü bir kulaklıklı yürüyüş. İstanbul'da yürümek gergin ve tetikte bir eylem olarak hatırlanırken Berlin, özgürlüğün kendiliğinden varsayıldığı, rahat ama steril bir alan olarak beliriyor.

      Yürüyüş, elinde Fiktionsbescheinigung'la kulüp kuyruklarında bekleyen bir göçmenin izini sürüyor. Onun bakışından Berlin'in sunduğu cool ve hazır queer konfor sorgulanıyor, evini yanında taşıyan insanların yalnızlığına kulak veriliyor.
    de: |
      Zwei Städte, Ein Körper ist ein ortsspezifischer Audiowalk, der am Ballhaus Prinzenallee im Wedding beginnt und das Publikum mit Stimmen im Kopfhörer durch die Straßen führt. Gehen in Istanbul erscheint als angespannter, wachsamer Akt, Berlin dagegen als bequemer, aber steriler Raum, in dem Freiheit als selbstverständlich gilt.

      Der Walk folgt einem Migranten, der mit einer Fiktionsbescheinigung in den Schlangen vor Clubs wartet. Aus seiner Perspektive wird der coole, vorgefertigte queere Komfort Berlins hinterfragt und die Einsamkeit derer hörbar, die ihr Zuhause mit sich tragen.
    en: |
      Zwei Städte, Ein Körper (Two Cities, One Body) is a site-specific audio walk that starts at Ballhaus Prinzenallee in Wedding and leads the audience through the streets with voices in their headphones. Walking in Istanbul is remembered as a tense, watchful act, while Berlin appears as a comfortable yet sterile space where freedom is taken for granted.

      The walk follows a migrant waiting in club queues with a Fiktionsbescheinigung. Through his eyes it questions the cool, ready-made queer comfort Berlin offers, and listens to the loneliness of those who carry their home with them.
  credits:
    - [textconceptdir, egemen-kalyon]
    - [dramaturgy, nesrin-karadag]
    - [sound, yigit-tanel-kackaya]
  shows:
    - {date: 2026-06-12, time: "18:00", venue: ballhaus, premiere: true}
    - {date: 2026-06-13, time: "17:30", venue: ballhaus}

- slug: the-monologue-box
  title: The Monologue Box
  year: 2026
  image: oyun/the-monologue-box.jpg
  poster: oyun/the-monologue-box.jpg
  form: {tr: "Birebir performans", de: "One-on-One-Performance", en: "One-to-one performance"}
  info: {tr: "Proud Haram Festivali 2026 programında. İngilizce.", de: "Im Rahmen des Proud Haram Festivals 2026. Auf Englisch.", en: "Part of Proud Haram Festival 2026. In English."}
  text:
    tr: |
      The Monologue Box, kapalı bir odada tek bir seyirciyle tek bir anlatıcıyı baş başa bırakan birebir karşılaşma. Ziyaretçi ne zaman gireceğine, ne kadar kalacağına ve ne zaman çıkacağına kendisi karar veriyor. Kutunun iki bölmesi var: ilkinde bir oyuncu doğrudan ziyaretçiye bir monolog anlatıyor, ikincisinde ziyaretçiler yüzlerini göstermeden ve adlarını vermeden kendi hikâyelerini sesli olarak anlatıyor.

      İkinci bölmede bırakılan hikâyeler sonra ilk bölmede oyuncunun ağzından yeniden anlatılıyor; birinin hikâyesi böylece bir başkasının dinlediği monologa dönüşüyor. Proud Haram Festivali'nin görünür kılmakla yanında durmak arasındaki sorusundan yola çıkan iş, kaynağından koptuğunda bir hikâyenin kime ait olduğunu soruyor.
    de: |
      The Monologue Box ist eine Eins-zu-eins-Begegnung in einem geschlossenen Raum, in dem eine Zuschauerin oder ein Zuschauer mit einer erzählenden Person allein ist. Wann man hineingeht, wie lange man bleibt und wann man wieder geht, entscheiden die Besuchenden selbst. Die Box hat zwei Kammern: In der ersten spricht eine Performerin oder ein Performer einen Monolog direkt an die Besuchenden, in der zweiten sprechen diese ihre eigenen Geschichten ein, ohne Gesicht und Namen preiszugeben.

      Die Geschichten aus der zweiten Kammer werden später in der ersten neu erzählt; so wird die Geschichte des einen zum Monolog, den ein anderer hört. Ausgehend von der Festivalfrage nach Sichtbarmachen und Solidarität fragt die Arbeit, wem eine Geschichte gehört, wenn sie sich von ihrem Ursprung löst.
    en: |
      The Monologue Box is a one-to-one encounter in a closed room where a single spectator and a single narrator are alone together. Visitors decide for themselves when to enter, how long to stay and when to leave. The box has two chambers: in the first a performer delivers a monologue directly to the visitor, in the second visitors record their own stories anonymously, without showing their faces or giving their names.

      The stories left in the second chamber are later retold in the first, so that one person's account becomes the monologue another person hears. Starting from the festival's question of visibility versus solidarity, the work asks to whom a story belongs once it has come loose from its origin.
  credits:
    - [conceditdir, ufuk-tan-altunkaya]
    - [text, didem-kaplan]
    - [performer, hazal-erdal]
  shows:
    - {date: 2026-06-12, time: "18:00", venue: ballhaus, premiere: true}
    - {date: 2026-06-13, time: "18:00", venue: ballhaus}

- slug: same
  title: SAME
  year: 2026
  image: foto/same-ip.jpg
  form: {tr: "Fiziksel tiyatro", de: "Physisches Theater", en: "Physical theatre"}
  info: {tr: "Proud Haram Festivali 2026 programında. Türkçe; Almanca ve İngilizce üstyazılı.", de: "Im Rahmen des Proud Haram Festivals 2026. Auf Türkisch mit deutschen und englischen Übertiteln.", en: "Part of Proud Haram Festival 2026. In Turkish with German and English surtitles."}
  text:
    tr: |
      SAME, dijital çağın görünürlük rejimini, kimliklerin nasıl üretildiğini ve gündelik hayatın sessizce nasıl dönüştüğünü bedenden yola çıkarak düşünen bir fiziksel tiyatro işi. Sosyal medya, algoritmalar, queer varoluş, toplumsal kutuplaşma ve bir yere ait olma ihtiyacı, elektronik ritimlerin eşliğinde giderek daralan bir oyun alanında birbirine dolanıyor.

      Minimalist sahnede kolektif bir deneyim bedenler üzerinden görünür hâle geliyor. Oyun çağın ruh hâlini seyircinin önüne seriyor ve sorduğu soruları bilerek cevapsız bırakıyor.
    de: |
      SAME ist eine Arbeit des physischen Theaters über das Sichtbarkeitsregime des digitalen Zeitalters, über die Produktion von Identität und den leisen Wandel des Alltags. Soziale Medien, Algorithmen, queere Existenz, gesellschaftliche Polarisierung und das Bedürfnis nach Zugehörigkeit verschränken sich zu elektronischen Rhythmen in einem Spielraum, der immer enger wird.

      Auf der minimalistischen Bühne wird eine kollektive Erfahrung über die Körper sichtbar. Das Stück öffnet den Blick auf die Stimmung einer Zeit und lässt seine Fragen bewusst offen.
    en: |
      SAME is a piece of physical theatre about the visibility regime of the digital age, the production of identity and the quiet transformation of everyday life. Social media, algorithms, queer existence, social polarisation and the need to belong intertwine to electronic rhythms in a playing space that keeps closing in.

      On a minimalist stage a collective experience becomes visible through the body. The piece opens up the mood of an era and deliberately leaves its questions unanswered.
  credits:
    - [writedirect, ufuk-tan-altunkaya]
    - [coordination, hazal-erdal]
    - [dramaturgy, didem-kaplan]
    - [light, zeki-elveris]
    - [cast, [kaan-songun, ilayda-fidanlik]]
  shows:
    - {date: 2026-06-12, time: "19:00", venue: ballhaus, premiere: true}

- slug: kozalar
  title: Kozalar
  year: 2025
  premiere_kind: premiere
  image: foto/kozalar-uc.jpg
  hero: foto/kozalar-genc.jpg
  hero_fit: true
  poster: oyun/kozalar.jpg
  gallery: [foto/kozalar-portre.jpg, foto/kozalar-genc.jpg, foto/kozalar-grotesk.jpg, foto/kozalar-sepya.jpg, foto/kozalar-mavi.jpg, foto/kozalar-cigl.jpg]
  form: {tr: "Adalet Ağaoğlu'nun oyunu", de: "Stück von Adalet Ağaoğlu", en: "A play by Adalet Ağaoğlu"}
  hook: {tr: "Bize dokunmasınlar da ne yaparlarsa yapsınlar.", de: "Sollen sie doch machen, was sie wollen, solange sie uns in Ruhe lassen.", en: "Let them do whatever they like, as long as they leave us alone."}
  quote: true
  text:
    tr: |
      Dışarıda dünya yanarken üç kadın kapıyı kilitliyor, kulaklarını tıkıyor, kendi kozalarına sarılıyor. Adalet Ağaoğlu oyunu 1971'de Ankara'da yazdı.

      Gerçekçi bir çerçevenin içine absürdü yerleştiren Kozalar, kendini terbiye diye sunan bir kayıtsızlığı sahneye taşıyor: karışmayan suçlu da olmaz. Aradan elli yıl geçti, her cümle hâlâ tanıdık.
    de: |
      Draußen brennt die Welt. Drinnen verriegeln drei Frauen die Tür, stopfen sich die Ohren zu und spinnen sich in ihre Kokons ein. Adalet Ağaoğlu, eine der prägenden Stimmen der modernen türkischen Literatur, schrieb das Stück 1971 in Ankara.

      Zwischen Realismus und Absurdem zeigt Kozalar eine Gleichgültigkeit, die sich als Anstand ausgibt: Wer sich nicht einmischt, macht sich nicht schuldig. Fünfzig Jahre später klingt jeder Satz vertraut.
    en: |
      Outside, the world is burning. Inside, three women lock the door, block their ears and wrap themselves in their cocoons. Adalet Ağaoğlu, one of the defining voices of modern Turkish literature, wrote the play in Ankara in 1971.

      Between realism and the absurd, Kozalar stages an indifference that passes itself off as decency: whoever stays out of it cannot be guilty. Fifty years on, every line still sounds familiar.
  credits:
    - [author, adalet-agaoglu]
    - [concept, ufuk-tan-altunkaya]
    - [cast, [aslihan-boruhan, ilayda-fidanlik, hazal-erdal]]
    - [dramaturgy, egemen-kalyon]
    - [advice, ozan-unlukoc]
    - [assistant, mert-merih]
    - [light, zeki-elveris]
  partners: [cabinet-novus]

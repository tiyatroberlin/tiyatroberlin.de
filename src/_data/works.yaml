- slug: ondan-sonra
  title: O'ndan Sonra
  year: 2022
  image: oyun/ondan-sonra.jpg
  form: {tr: "Kulaklıklı yürüyüş", de: "Audiowalk", en: "Audio walk"}
  hook: {tr: "Dört yabancı ve görünmeyen bir Hanım.", de: "Vier Fremde und eine unsichtbare Dame.", en: "Four strangers and an invisible lady."}
  text:
    tr: |
      Kulaklıklar takılıyor, Berlin sokaklarında bir takip başlıyor. Seyirci birbirini hiç tanımayan dört kişinin peşine düşüyor ve aralarındaki bağı arıyor.

      Hepsinin peşinde olduğu biri var: hiç görünmeyen Hanım. Didem Kaplan'ın metni göçü, ötekiliği ve yarım kalmış bir modernleşmeyi bugünün insanları üzerinden soruyor. Şehir dekor değil, oyunun kendisi.
    de: |
      Kopfhörer auf, und mitten in Berlin beginnt eine Verfolgung. Das Publikum folgt vier Menschen, die einander nicht kennen, und sucht nach dem, was sie verbindet.

      Alle sind auf der Spur einer Person, die nie zu sehen ist: der Dame. Didem Kaplans Text fragt anhand heutiger Lebensgeschichten nach Migration, Fremdsein und einer unvollendeten Moderne. Die Stadt ist keine Kulisse, sie ist das Stück.
    en: |
      Headphones on, and a pursuit begins on the streets of Berlin. The audience follows four people who do not know each other and looks for what connects them.

      They are all on the trail of someone who never appears: the Lady. Didem Kaplan's text explores migration, otherness and an unfinished modernity through present-day lives. The city is not a backdrop; it is the play.
  info: {tr: "Yaklaşık 60 dakika yürüyüş. Başlangıç ve bitiş noktası farklı. Kulaklık için kimlik bırakılır. Tekerlekli sandalyeyle erişilebilir değil.", de: "Etwa 60 Minuten zu Fuß. Start und Ziel sind verschieden. Für die Kopfhörer wird ein Ausweis hinterlegt. Nicht rollstuhlgerecht.", en: "About 60 minutes on foot. Start and end points differ. Photo ID required as a deposit for the headphones. Not wheelchair accessible."}
  credits:
    - [text, didem-kaplan]
    - [concept, ufuk-tan-altunkaya]
    - [cast, [ahmet-ozer, aslihan-boruhan, mesut-gungor, fatos-uysal]]
    - [dramaturgy, [egemen-kalyon, ozan-unlukoc]]
    - [sound, zeki-elveris]
  partners: [cabinet-novus]
  funders: [fdk]
  shows:
    - {date: 2022-11-14, venue: nikolaiviertel, premiere: true}

- slug: nested
  title: Nested
  year: 2022
  image: oyun/nested.jpg
  form: {tr: "Açık havada performans", de: "Performance im Freien", en: "Outdoor performance"}
  info: {tr: "48 Stunden Neukölln festivali programında, Körnerpark'ta oynandı.", de: "Im Rahmen von 48 Stunden Neukölln, gezeigt im Körnerpark.", en: "Part of the 48 Stunden Neukölln festival, performed in Körnerpark."}
  hook: {tr: "Göç sanatçıya ne yapar?", de: "Was macht Migration mit Künstler*innen?", en: "What does migration do to artists?"}
  text:
    tr: |
      Batılı imgelerle biçimlenmiş Doğu kültürlerinden gelen sanatçılar göç ettiklerinde ne olur? Geride ne kalır, yeni şehirde hangi yere yerleşirler?

      Nested, Körnerpark'ın açık havasında beden, video ve ses arasında kurulan bir performans. Göçü bir taşınma olarak değil, bir yuva kurma ve onu yeniden bozma hâli olarak düşünüyor.
    de: |
      Was geschieht mit Künstler*innen aus östlichen Kulturen, die selbst von westlichen Bildern geprägt sind, wenn sie migrieren? Was lassen sie zurück, welchen Platz nehmen sie in der neuen Stadt ein?

      Nested ist eine Performance unter freiem Himmel im Körnerpark, zwischen Körper, Video und Klang. Sie denkt Migration nicht als Umzug, sondern als fortwährendes Nestbauen und Wiederauflösen.
    en: |
      What happens to artists from Eastern cultures, themselves shaped by Western images, when they migrate? What do they leave behind, and what place do they take in the new city?

      Nested is an open-air performance in Körnerpark, between body, video and sound. It thinks of migration not as a move but as the ongoing making and unmaking of a nest.
  credits:
    - [writedirect, ufuk-tan-altunkaya]
    - [cast, [ahmet-ozer, tamer-serkan-subasi]]
    - [video, angelica-germana-bozza]
    - [dramaturgy, egemen-kalyon]
    - [coordination, ilayda-fidanlik]
    - [sound, zeki-elveris]
  partners: [cabinet-novus]
  funders: [ausland]
  shows:
    - {date: 2022-06-24, venue: koernerpark, premiere: true}

- slug: uzak
  title: Uzak
  year: 2021
  image: oyun/uzak.jpg
  poster: oyun/uzak.jpg
  form: {tr: "Tek seyircilik kulaklıklı yürüyüş", de: "Audiowalk für eine Person", en: "Audio walk for one"}
  hook: {tr: "Tek seyirci, bir mahalle, iki zaman.", de: "Eine Person, ein Viertel, zwei Zeiten.", en: "One spectator, one neighbourhood, two times."}
  text:
    tr: |
      Bergama, Kale Mahallesi. Kulaklıklar takılıyor ve tek bir seyirci yola çıkıyor. Chris Marker'ın La Jetée'sinden yola çıkan Uzak, Üçüncü Dünya Savaşı'ndan sonra geçmişe ve geleceğe gönderilen bir tutsağın hikâyesini tarihi bir mahallenin sokaklarına yerleştiriyor.

      Şehir bir zaman makinesine dönüşüyor. Seyirci, ölümle yaşam arasında, amaç ve varoluş üzerine bir anının peşinden yürüyor.
    de: |
      Bergama, Kale Mahallesi. Kopfhörer auf, und eine einzige Person macht sich auf den Weg. Ausgehend von Chris Markers La Jetée verlegt Uzak die Geschichte eines Gefangenen, der nach dem Dritten Weltkrieg in Vergangenheit und Zukunft geschickt wird, in die Gassen eines historischen Viertels.

      Die Stadt wird zur Zeitmaschine. Das Publikum folgt einer Erinnerung, zwischen Tod und Leben, auf der Suche nach Sinn.
    en: |
      Bergama, Kale Mahallesi. Headphones on, and a single spectator sets off. Starting from Chris Marker's La Jetée, Uzak moves the story of a prisoner sent into the past and the future after the Third World War into the lanes of a historic neighbourhood.

      The city becomes a time machine. The audience follows a memory, between death and life, searching for purpose.
  info: {tr: "Yaklaşık 40 dakika, arasız. Tek seyirci için.", de: "Etwa 40 Minuten, ohne Pause. Für eine Person.", en: "About 40 minutes, no interval. For one person."}

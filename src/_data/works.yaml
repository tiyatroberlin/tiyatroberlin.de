- slug: sen-istanbuldan-daha-guzelsin
  title: Sen İstanbul'dan Daha Güzelsin
  year: 2023
  premiere_kind: premiere
  image: oyun/sen-istanbuldan.jpg
  form: {tr: "Oyun", de: "Stück", en: "Play"}
  hook: {tr: "Büyükanne, anne, torun. Bir şehirde elli yıl.", de: "Großmutter, Mutter, Enkelin. Fünfzig Jahre in einer Stadt.", en: "Grandmother, mother, granddaughter. Fifty years in one city."}
  text:
    tr: |
      Büyükanne, anne, torun: Ayfer, Başak, Melis. Aynı aileden üç kadın ve İstanbul'da geçen yaklaşık elli yıl. Farklı evler, iç sesler, söylenmemiş cümleler.

      Bu kadar kalabalık bir şehirde her yer neden bu kadar boş? Murat Mahmutyazıcıoğlu'nun metni, kuşaktan kuşağa aktarılan suskunluğun izini sürüyor.
    de: |
      Großmutter, Mutter, Enkelin: Ayfer, Başak, Melis. Drei Frauen einer Familie und rund fünfzig Jahre in Istanbul. Verschiedene Wohnungen, innere Stimmen, Ungesagtes.

      Eine Stadt mit so vielen Menschen, und doch scheint überall Leere zu sein. Der Text von Murat Mahmutyazıcıoğlu folgt dem Schweigen, das von Generation zu Generation weitergegeben wird.
    en: |
      Grandmother, mother, granddaughter: Ayfer, Başak, Melis. Three women of one family and some fifty years in Istanbul. Different homes, inner voices, things left unsaid.

      A city with so many people, and yet emptiness everywhere. Murat Mahmutyazıcıoğlu's text traces the silence handed down from one generation to the next.
  credits:

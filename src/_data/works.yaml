- slug: uftade
  title: Üftade
  year: 2023
  image: oyun/uftade.jpg
  form: {tr: "Oyun", de: "Stück", en: "Play"}
  info: {tr: "Haziran 2023'te Maxim Gorki Theater'da, 6. Berliner Herbstsalon kapsamındaki GEZİ – TEN YEARS AFTER programında konuk oyun olarak sahnelendi.", de: "Gastspiel im Juni 2023 am Maxim Gorki Theater, im Rahmen des 6. Berliner Herbstsalons (GEZİ – TEN YEARS AFTER).", en: "Guest performance at the Maxim Gorki Theater in June 2023, as part of the 6th Berliner Herbstsalon (GEZİ – TEN YEARS AFTER)."}
  hook: {tr: "Haziran 2013. Bir tiyatro sahnesi revire dönüşüyor.", de: "Juni 2013. Eine Theaterbühne wird zum Lazarett.", en: "June 2013. A stage becomes a field hospital."}
  text:
    tr: |
      Haziran 2013. Gezi Parkı'nın hemen yanında, Beyoğlu'nun küçük tiyatrolarından birinin sahnesi yaralılar ve doktorları için bir revire dönüşüyor.

      Üftade, direnişin ilk 48 saatini bir Alman tiyatrocunun ve tiyatro çalışanlarının gözünden anlatıyor. Başlık hem düşkün, yardıma muhtaç olanı hem de tiyatronun bulunduğu sokağı anlatıyor. 2010'larda gençlerin açtığı küçük sahneler o günlerde birer sığınağa dönüşmüştü; oyun onların hatırasını kayda geçiriyor.
    de: |
      Juni 2013. Gleich neben dem Gezi-Park wird die Bühne eines kleinen Theaters in Beyoğlu zum Lazarett für Verletzte und ihre Ärzt*innen.

      Üftade erzählt die ersten 48 Stunden des Widerstands aus der Sicht eines deutschen Theatermachers und der Mitarbeiter*innen des Hauses. Der Titel bedeutet die Gefallene, die auf Hilfe Angewiesene, und ist zugleich der Name der Straße, in der das Theater liegt. Die kleinen Bühnen, die junge Leute in den 2010er Jahren eröffnet hatten, wurden damals zu Zufluchtsorten; das Stück hält ihre Erinnerung fest.
    en: |
      June 2013. Right next to Gezi Park, the stage of a small theatre in Beyoğlu becomes a field hospital for the wounded and their doctors.

      Üftade tells the first 48 hours of the resistance through the eyes of a German theatre-maker and the theatre's staff. The title means the fallen, the one in need of help, and is also the name of the street where the theatre stands. The small stages young people had opened in the 2010s became shelters in those days; the play keeps their memory on record.
  credits:
    - [text, didem-kaplan]
    - [concept, ufuk-tan-altunkaya]
    - [cast, [ahmet-ozer, sandra-ruffin, ufuk-tan-altunkaya]]
    - [dramaturgy, egemen-kalyon]
    - [sound, cem-ontas]
    - [assistant, sezer-gunduz]
  partners: [mekan-arti, cabinet-novus]
  shows:

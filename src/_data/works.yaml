- slug: avzer
  title: Avzer
  year: 2023
  image: oyun/avzer.jpg
  form: {tr: "Tek kişilik oyun", de: "Solo", en: "Solo"}
  info: {tr: "Haziran 2023'te Maxim Gorki Theater'da, 6. Berliner Herbstsalon kapsamındaki GEZİ – TEN YEARS AFTER programında konuk oyun olarak sahnelendi.", de: "Gastspiel im Juni 2023 am Maxim Gorki Theater, im Rahmen des 6. Berliner Herbstsalons (GEZİ – TEN YEARS AFTER).", en: "Guest performance at the Maxim Gorki Theater in June 2023, as part of the 6th Berliner Herbstsalon (GEZİ – TEN YEARS AFTER)."}
  hook: {tr: "Ankara, Haziran 2013. Bir sokak çocuğu değişmiş bir şehre uyanıyor.", de: "Ankara, Juni 2013. Ein Straßenkind erwacht in einer veränderten Stadt.", en: "Ankara, June 2013. A street kid wakes up in a changed city."}
  text:
    tr: |
      Avzer üç yaşından beri yurtta büyüdü, kaçtı, şimdi sokakta yaşıyor. Haziran 2013'te bir sabah Kızılay'a uyandığında şehir değişmiş: kalabalık, öfke ve hiç tanımadığı bir dayanışma.

      Şamil Yılmaz'ın metni Gezi direnişini, kimsenin hesaba katmadığı birinin gözünden anlatıyor. Bir sokak çocuğu için kamusal alan ilk kez herkesin olduğunda neler değişir?
    de: |
      Avzer ist seit seinem dritten Lebensjahr im Heim aufgewachsen, ist weggelaufen und lebt jetzt auf der Straße. Als er im Juni 2013 eines Morgens am Kızılay-Platz aufwacht, hat sich die Stadt verändert: Menschenmengen, Wut und eine Solidarität, die er nicht kennt.

      Der Text von Şamil Yılmaz erzählt die Gezi-Proteste aus der Sicht von jemandem, mit dem niemand gerechnet hat. Was verändert sich für ein Straßenkind, wenn der öffentliche Raum zum ersten Mal allen gehört?
    en: |
      Avzer grew up in care from the age of three, ran away, and now lives on the street. One morning in June 2013 he wakes up on Kızılay square and the city has changed: crowds, anger, and a solidarity he has never known.

      Şamil Yılmaz's text tells the Gezi protests through the eyes of someone nobody counted on. What changes for a street kid when public space belongs, for the first time, to everyone?
  credits:

- slug: pride-93
  title: Pride '93
  year: 2024
  image: foto/pride-grup.jpg
  poster: oyun/pride-93.jpg
  gallery: [foto/pride-el.jpg, foto/pride-ikili.jpg, foto/pride-tulum.jpg]
  form: {tr: "Belgesel tiyatro", de: "Dokumentartheater", en: "Documentary theatre"}
  hook: {tr: "İstanbul, 1993. İlk Onur Yürüyüşü başlamadan yasaklanıyor.", de: "Istanbul, 1993. Der erste Pride wird verboten, bevor er beginnt.", en: "Istanbul, 1993. The first Pride is banned before it begins."}
  text:
    tr: |
      İstanbul, 1993. Küçük bir grup Türkiye'nin ilk Onur Yürüyüşü'nü hazırlıyor. Yürüyüş başlamadan yasaklanıyor.

      Pride '93 o yasaktan önceki haftalara dönüyor: örgütlenmenin ilk denemelerine, Ülker Sokak'ın evlerine, baskıya, korkuya ve henüz adı konmamış bir cesarete. Oyun, Siyah Pembe Üçgen İzmir'in sözlü tarih çalışmasındaki tanıklıklardan ve Kaos GL dergi arşivinden geliştirildi.

      2015'ten beri İstanbul'da Onur Yürüyüşü yapılamıyor. Pride '93 bugünü okuyabilmek için başlangıca bakıyor.
    de: |
      Istanbul, 1993. Eine Handvoll Menschen bereitet den ersten Pride der Türkei vor. Er wird verboten, bevor er beginnt.

      Pride '93 kehrt in die Wochen davor zurück: zu den ersten Versuchen, sich zu organisieren, zu den Wohnungen der Ülker Sokak, zu Repression, Angst und einem Übermut, für den es noch keine Sprache gab. Das Stück basiert auf Zeitzeug*innen-Interviews aus dem Oral-History-Projekt von Siyah Pembe Üçgen İzmir und auf dem Archiv der Zeitschrift Kaos GL.

      Seit 2015 kann in Istanbul kein Pride mehr stattfinden. Pride '93 blickt auf den Anfang, um diese Gegenwart lesbar zu machen.
    en: |
      Istanbul, 1993. A handful of people prepare Turkey's first Pride. It is banned before it begins.

      Pride '93 returns to the weeks before: the first attempts to organise, the flats of Ülker Sokak, repression, fear and a daring that had no language yet. The piece draws on witness interviews from the oral history project of Siyah Pembe Üçgen İzmir and on the archive of Kaos GL magazine.

      Since 2015, no Pride has been allowed in Istanbul. Pride '93 looks back to the beginning to make the present legible.
  sources: {tr: "Kaynaklar: 90'larda Lubunya Olmak (Siyah Pembe Üçgen İzmir) · Kaos GL dergi arşivi", de: "Quellen: 90'larda Lubunya Olmak (Siyah Pembe Üçgen İzmir) · Archiv der Zeitschrift Kaos GL", en: "Sources: 90'larda Lubunya Olmak (Siyah Pembe Üçgen İzmir) · Kaos GL magazine archive"}

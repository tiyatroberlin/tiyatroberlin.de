about:
  tr:
    title: Hakkımızda
    lead: Tiyatro Berlin, 2021'de Berlin'de bir araya gelen tiyatrocuların kurduğu bağımsız bir kolektif. O günden bu yana oyunlarımızı yalnızca sahnelerde değil, barlarda, parklarda ve şehrin sokaklarında da oynuyoruz; çünkü bir hikâyenin nerede anlatıldığının, ne anlatıldığı kadar önemli olduğuna inanıyoruz.
    sections:
      - h: Yaklaşımımız
        body: |
          Bizim için tiyatro, bir toplumun neyi hatırlayıp neyi unutmayı seçtiğini tartıştığı kamusal bir alan. Resmî tarihin kayda geçirmediği hayatlar, sessizce kapatılmış dosyalar, bir kuşaktan ötekine söylenmeden aktarılan şeyler bizi harekete geçiren malzeme. Asıl derdimiz de bu deneyimleri sahneye taşırken onları sahiplenmemek, tanıklığa saygıyı korurken seyirciyle gerçek bir karşılaşma kurabilmek.

          Bu yüzden çoğu zaman sözlü tarihle, tanık görüşmeleriyle ve arşiv belgeleriyle çalışıyor, tiyatroyu başka yerde yer bulamayan anlatıların sığındığı bir karşı-arşiv olarak görüyoruz. Şehri bir dekor değil, oyunun kendisi olarak ele alıyoruz: kulaklıklı yürüyüşlerimizde seyirci izlemeyi bırakıp oyunun içinde yürümeye başlıyor. Metni, mekânı, sesi ve oyunculuğu aynı masa etrafında, birlikte üretiyoruz. Bir arabesk şarkı, eski bir film sahnesi ya da sokakta duyulmuş bir cümle çağdaş dramaturjiyle aynı sahnede durabiliyor; seyircinin zaten yanında getirdiği bu dili ciddiye alıyoruz.

          Bağımsızlığı da bir zorunluluktan çok estetik bir tercih olarak görüyoruz. Bir kurum adına üretmediğimizde hangi konunun fonlanabilir olduğunu değil, neyin anlatılması gerektiğini sorabiliyor, henüz adı konmamış biçimleri deneme özgürlüğünü koruyabiliyoruz.
      - h: Başlangıç için bir yer
        body: |
          2021'den bu yana on beşten fazla oyuncu, dramaturg, ses ve ışık sanatçısı bizimle çalıştı. Neredeyse hepsi Türkiye'de yıllarca profesyonel tiyatro yapmış, Berlin'e ise yeni gelmişti; çoğu için Tiyatro Berlin, Almanya'daki ilk sözleşme ve ilk prömiyer anlamına geldi.

          Bunu hiçbir zaman bir program olarak ilan etmedik, ama zamanla işimizin en önemli yanı hâline geldi: hiçbir kurumun kapısını açmadığı sanatçılar için bir buluşma yeri ve onları görünür kılan bir ağ. Bugün bu ağı, yeni gelenlerin şehre yerleşmesini, öğrenmeyi ve birbirine bağlanmayı destekleyen projelerle büyütmeye çalışıyoruz.
      - h: Nasıl çalışıyoruz
        body: |
          Bir ofisimiz ya da idari kadromuz yok; burada çalışan herkes aynı zamanda sanatçı, işin örgütlenmesi de sanatsal sürecin bir parçası. Bazı oyunlarımız fonla, bazıları tamamen kendi imkânlarımızla üretildi; ama programımızı hiçbir zaman neyin onaylanacağına göre belirlemedik. Bilet fiyatlarını da bilerek düşük tutuyoruz, çünkü tiyatronun herkese açık kalması gerektiğine inanıyoruz.

          Oyunların yanında yıl boyu süren bir tiyatro pedagojisi programı yürütüyoruz: iki seviyede yetişkin oyunculuk atölyesi, dramaturji ve oyun inceleme, komedi yazımı.
    direction: "Genel sanat yönetmeni"
  de:
    title: Über uns
    lead: Tiyatro Berlin ist ein freies Theaterkollektiv, das sich 2021 in Berlin gegründet hat. Seitdem spielen wir nicht nur auf Bühnen, sondern auch in Bars, in Parks und auf den Straßen der Stadt, weil wir davon überzeugt sind, dass der Ort, an dem eine Geschichte erzählt wird, genauso viel bedeutet wie die Geschichte selbst.
    sections:
      - h: Haltung
        body: |
          Theater verstehen wir als öffentlichen Raum, in dem eine Gesellschaft aushandelt, woran sie sich erinnert und was sie lieber vergisst. Was uns antreibt, sind Lebensgeschichten, die in keiner offiziellen Chronik vorkommen, Akten, die stillschweigend geschlossen wurden, und das, was von einer Generation zur nächsten weitergegeben wird, ohne je ausgesprochen zu werden. Die eigentliche Frage ist dabei, wie diese Erfahrungen auf die Bühne kommen können, ohne vereinnahmt zu werden, und wie sich der Respekt vor dem Zeugnis mit einer echten Begegnung zwischen Bühne und Publikum verbinden lässt.

          Deshalb arbeiten wir häufig mit Oral History, mit Zeitzeug*innen-Interviews und mit Archivmaterial, sodass das Theater zu einer Art Gegenarchiv wird, in dem Erzählungen Zuflucht finden, die anderswo keinen Platz haben. Die Stadt behandeln wir nicht als Kulisse, sondern als Material: In unseren Audiowalks hört das Publikum auf zuzuschauen und beginnt, im Stück mitzugehen. Text, Raum, Klang und Spiel entstehen gemeinsam am selben Tisch. Ein Arabesk-Lied, eine Szene aus einem alten Film oder ein Satz, der auf der Straße aufgeschnappt wurde, können neben zeitgenössischer Dramaturgie bestehen, denn wir nehmen die Sprache ernst, die das Publikum ohnehin mitbringt.

          Unabhängigkeit ist für uns weniger ein Mangel als eine ästhetische Entscheidung. Wer nicht im Auftrag einer Institution produziert, kann fragen, was erzählt werden muss, statt was förderfähig ist, und sich die Freiheit bewahren, Formen zu erproben, für die es noch keinen Namen gibt.
      - h: Ein Ort für den Anfang
        body: |
          Seit 2021 haben mehr als fünfzehn Darsteller*innen, Dramaturg*innen sowie Licht- und Klangkünstler*innen mit uns gearbeitet. Fast alle hatten zuvor jahrelang professionell in der Türkei Theater gemacht und waren gerade erst in Berlin angekommen; für viele von ihnen bedeutete Tiyatro Berlin den ersten Vertrag und die erste Premiere in Deutschland.

          Als Programm haben wir das nie ausgerufen, doch mit der Zeit ist es zum wichtigsten Teil unserer Arbeit geworden: ein Treffpunkt für Künstler*innen, denen keine Institution die Tür öffnet, und ein Netzwerk, das sie sichtbar macht. Heute bauen wir dieses Netzwerk mit eigenen Projekten aus, die das Ankommen in der Stadt, das Weiterlernen und die gegenseitige Vernetzung unterstützen.
      - h: Wie wir arbeiten
        body: |
          Wir haben weder ein Büro noch eine Verwaltung; alle, die hier arbeiten, sind Künstler*innen, und auch die Organisation gehört zum künstlerischen Prozess. Einige unserer Produktionen wurden gefördert, andere ganz aus eigener Kraft realisiert, aber unser Programm haben wir nie danach ausgerichtet, was bewilligt wird. Die Eintrittspreise halten wir bewusst niedrig, weil Theater für alle zugänglich bleiben soll.

          Neben den Produktionen betreiben wir eine kontinuierliche theaterpädagogische Arbeit mit Ensembles für Erwachsene auf zwei Niveaus, Werkstätten zu Dramaturgie und Stückanalyse sowie einem Kurs für Comedy-Schreiben.
      - h: Förderung und Einladungen
        body: |
          Unsere Produktionen wurden unter anderem von der Senatsverwaltung für Kultur und Europa, dem Fonds Darstellende Künste und dem Goethe-Institut gefördert. Arbeiten des Kollektivs und seiner Mitglieder waren bei 48 Stunden Neukölln, beim Proud Haram Festival Berlin, beim Türkisch-Deutschen Theaterfestival, beim Theaterfestival Bergama und beim Internationalen Theaterfestival Istanbul eingeladen.
    direction: "Künstlerische Leitung"
  en:
    title: About
    lead: Tiyatro Berlin is an independent theatre collective founded in Berlin in 2021. Since then we have played not only on stages but in bars, in parks and on the streets of the city, because we believe that where a story is told matters as much as the story itself.
    sections:
      - h: Approach
        body: |
          We think of theatre as a public space in which a society works out what it remembers and what it would rather forget. What moves us are lives that no official history records, files that were quietly closed, and the things passed from one generation to the next without ever being said. The real question is how these experiences can reach the stage without being appropriated, and how respect for testimony can sit alongside a genuine encounter with an audience.

          That is why we so often work with oral history, witness interviews and archival material, so that the theatre becomes a kind of counter-archive for stories that have no place elsewhere. We treat the city not as a backdrop but as material: on our audio walks, the audience stops watching and starts walking through the piece. Text, space, sound and performance are made together, around the same table. An arabesk song, a scene from an old film or a sentence overheard on the street can stand beside contemporary dramaturgy, because we take seriously the language the audience already brings with it.

          For us, independence is less a shortage than an aesthetic choice. When you are not producing on behalf of an institution, you can ask what needs to be told rather than what can be funded, and keep the freedom to try out forms that do not have a name yet.
      - h: A place to begin
        body: |
          Since 2021, more than fifteen performers, dramaturgs, sound and light artists have worked with us. Almost all of them had spent years making theatre professionally in Turkey and had only just arrived in Berlin; for many, Tiyatro Berlin meant their first contract and first premiere in Germany.

          We never announced this as a programme, but over time it became the most important part of what we do: a meeting place for artists to whom no institution opens its doors, and a network that makes them visible. Today we are growing that network through projects that support arriving in the city, continued learning and connecting with one another.
      - h: How we work
        body: |
          We have no office and no administrative staff; everyone here is an artist, and organising the work is part of the artistic process. Some of our productions were funded, others made entirely on our own means, but we have never shaped the programme around what gets approved. We keep ticket prices deliberately low, because theatre should stay open to everyone. Alongside the productions we run a year-round theatre education programme for adults.
    direction: "Artistic director"

edu:
  tr:
    title: Tiyatro pedagojisi
    lead: Atölyelerimizi, sahnenin hem önünde hem arkasında çalışan kolektif üyeleri yürütüyor. Bu yüzden oyunculuğu burada bir ders kitabından değil, her gün sahnede bu işi yapan insanlardan öğreniyorsunuz.
    body: |
      Daha önce hiç sahneye çıkmamış yetişkinler için de, devam etmek isteyenler için de bir grubumuz var. Gruplar bir sezon boyunca her hafta aynı odada buluşuyor ve sesle, bedenle, nefesle, doğaçlamayla ve metinle çalışırken tiyatronun tarihine ve dramaturjisine de kafa yoruyor.

      Tiyatro pedagojisini bir yan faaliyet olarak görmüyoruz. Tiyatroyu içeriden tanıyan, oyunlara başka gözle bakan bir seyirci bu odalarda oluşuyor ve bu da bizim için en az bir prömiyer kadar değerli.
  de:
    title: Theaterpädagogik
    lead: Unsere Kurse leiten Mitglieder des Kollektivs, die selbst vor und hinter der Bühne arbeiten. Wer hier spielen lernt, lernt es also nicht aus dem Lehrbuch, sondern von Menschen, für die das Theater tägliche Praxis ist.
    body: |
      Es gibt Ensembles für Erwachsene, die noch nie auf einer Bühne standen, ebenso wie für Fortgeschrittene. Die Gruppen treffen sich eine ganze Spielzeit lang jede Woche im selben Raum und arbeiten mit Stimme, Körper, Atem, Improvisation und Text, während sie sich zugleich mit Theatergeschichte und Dramaturgie auseinandersetzen.

      Theaterpädagogik ist für uns kein Nebenangebot. In diesen Räumen entsteht ein Publikum, das Theater von innen kennt und anders auf die Bühne schaut, und das ist uns mindestens so viel wert wie eine Premiere.
  en:
    title: Theatre education
    lead: Our courses are led by members of the collective who work both in front of and behind the stage, so here you learn acting not from a textbook but from people for whom theatre is daily practice.
    body: |
      There are ensembles for adults who have never been on a stage as well as for those who want to go further. The groups meet every week in the same room for a whole season, working with voice, body, breath, improvisation and text while also engaging with theatre history and dramaturgy.

      For us, theatre education is not a side activity. These rooms are where an audience forms that knows theatre from the inside and looks at the stage differently, and that matters to us at least as much as a premiere.

about:
  tr:
    title: Hakkımızda
    lead: Tiyatro Berlin, 2021'de Berlin'de bir araya gelen tiyatrocuların kurduğu bağımsız bir kolektif. Kuruluşundan bu yana oyunlarını yalnızca sahnelerde değil, barlarda, parklarda ve şehrin sokaklarında da oynuyor; çünkü bir hikâyenin nerede anlatıldığının, ne anlatıldığı kadar önemli olduğuna inanıyor.
    sections:
    - h: Yaklaşım
      body: 'Tiyatro Berlin için tiyatro, bir toplumun neyi hatırlayıp neyi unutmayı seçtiğini tartıştığı kamusal bir alan. Resmî tarihin kayda geçirmediği hayatlar, sessizce kapatılmış dosyalar, bir kuşaktan ötekine söylenmeden aktarılan şeyler kolektifin çalışmalarının çıkış noktası. Asıl mesele, bu deneyimleri sahneye taşırken onları sahiplenmemek, tanıklığa saygıyı korurken seyirciyle gerçek bir karşılaşma kurabilmek.


        Bu yüzden Tiyatro Berlin çoğu zaman sözlü tarihle, tanık görüşmeleriyle ve arşiv belgeleriyle çalışıyor ve tiyatroyu, başka yerde yer bulamayan anlatıların sığındığı bir karşı-arşiv olarak görüyor. Şehir de oyunun malzemesine dönüşüyor: kulaklıklı yürüyüşlerde seyirci oyunun içinden geçerek ilerliyor. Metin, mekân, ses ve oyunculuk aynı masa etrafında, birlikte üretiliyor. Bir arabesk şarkı, eski bir film sahnesi ya da sokakta duyulmuş bir cümle çağdaş dramaturjiyle aynı sahnede durabiliyor; Tiyatro Berlin, seyircinin zaten yanında getirdiği bu dili ciddiye alıyor.


        Kolektif için bağımsızlık estetik bir tercih. Bir kurum adına üretmediği için neyin anlatılması gerektiğini kendisi soruyor ve henüz adı konmamış biçimleri deneme özgürlüğünü koruyor.

        '
    - h: Başlangıç için bir yer
      body: '2021''den bu yana on beşten fazla oyuncu, dramaturg, ses ve ışık sanatçısı Tiyatro Berlin''de çalıştı. Neredeyse hepsi Türkiye''de yıllarca profesyonel tiyatro yapmış, Berlin''e ise yeni gelmişti; çoğu için Tiyatro Berlin, Almanya''daki ilk sözleşme ve ilk prömiyer anlamına geldi.


        Bu hiçbir zaman bir program olarak ilan edilmedi, ama zamanla kolektifin işinin en önemli yanı hâline geldi: hiçbir kurumun kapısını açmadığı sanatçılar için bir buluşma yeri ve onları görünür kılan bir ağ. Tiyatro Berlin bugün bu ağı, yeni gelenlerin şehre yerleşmesini, öğrenmeyi ve birbirine bağlanmayı destekleyen projelerle büyütüyor.

        '
    - h: Çalışma biçimi
      body: 'Tiyatro Berlin''in bir ofisi ya da idari kadrosu yok; burada çalışan herkes aynı zamanda sanatçı, işin örgütlenmesi de sanatsal sürecin bir parçası. Oyunların bir kısmı fonla, bir kısmı tamamen kolektifin kendi imkânlarıyla üretildi; ama program hiçbir zaman neyin onaylanacağına göre belirlenmedi. Bilet fiyatları da bilerek düşük tutuluyor, çünkü Tiyatro Berlin tiyatronun herkese açık kalması gerektiğine inanıyor.


        Oyunların yanında yıl boyu süren bir tiyatro pedagojisi programı da yürütülüyor: yetişkinler için bir oyunculuk atölyesi ile reji, kuram ve seyir üzerine bir okuma atölyesi.

        '
    direction: Genel sanat yönetmeni
  de:
    title: Über uns
    lead: Tiyatro Berlin ist ein freies Theaterkollektiv, das sich 2021 in Berlin gegründet hat. Seitdem spielt es nicht nur auf Bühnen, sondern auch in Bars, in Parks und auf den Straßen der Stadt, denn Tiyatro Berlin ist überzeugt, dass der Ort, an dem eine Geschichte erzählt wird, genauso viel bedeutet wie die Geschichte selbst.
    sections:
    - h: Haltung
      body: 'Für Tiyatro Berlin ist Theater ein öffentlicher Raum, in dem eine Gesellschaft aushandelt, woran sie sich erinnert und was sie lieber vergisst. Ausgangspunkt der Arbeit sind Lebensgeschichten, die in keiner offiziellen Chronik vorkommen, Akten, die stillschweigend geschlossen wurden, und das, was von einer Generation zur nächsten weitergegeben wird, ohne je ausgesprochen zu werden. Die eigentliche Frage ist dabei, wie diese Erfahrungen auf die Bühne kommen können, ohne vereinnahmt zu werden, und wie sich der Respekt vor dem Zeugnis mit einer echten Begegnung zwischen Bühne und Publikum verbinden lässt.


        Deshalb arbeitet das Kollektiv häufig mit Oral History, mit Zeitzeug*innen-Interviews und mit Archivmaterial; das Theater wird so zu einer Art Gegenarchiv, in dem Erzählungen Zuflucht finden, die anderswo keinen Platz haben. Auch die Stadt wird zum Material: In den Audiowalks bewegt sich das Publikum mitten durch das Stück. Text, Raum, Klang und Spiel entstehen gemeinsam am selben Tisch. Ein Arabesk-Lied, eine Szene aus einem alten Film oder ein auf der Straße aufgeschnappter Satz können neben zeitgenössischer Dramaturgie bestehen, denn Tiyatro Berlin nimmt die Sprache ernst, die das Publikum ohnehin mitbringt.


        Unabhängigkeit ist für das Kollektiv eine ästhetische Entscheidung. Weil es nicht im Auftrag einer Institution produziert, bestimmt es selbst, was erzählt werden muss, und bewahrt sich die Freiheit, Formen zu erproben, für die es noch keinen Namen gibt.

        '
    - h: Ein Ort für den Anfang
      body: 'Seit 2021 haben mehr als fünfzehn Darsteller*innen, Dramaturg*innen sowie Licht- und Klangkünstler*innen bei Tiyatro Berlin gearbeitet. Fast alle hatten zuvor jahrelang professionell in der Türkei Theater gemacht und waren gerade erst in Berlin angekommen; für viele bedeutete Tiyatro Berlin den ersten Vertrag und die erste Premiere in Deutschland.


        Als Programm wurde das nie ausgerufen, doch mit der Zeit ist es zum wichtigsten Teil der Arbeit geworden: ein Treffpunkt für Künstler*innen, denen keine Institution die Tür öffnet, und ein Netzwerk, das sie sichtbar macht. Heute baut Tiyatro Berlin dieses Netzwerk mit eigenen Projekten aus, die das Ankommen in der Stadt, das Weiterlernen und die gegenseitige Vernetzung unterstützen.

        '
    - h: Arbeitsweise
      body: 'Tiyatro Berlin hat weder ein Büro noch eine Verwaltung; alle, die hier arbeiten, sind Künstler*innen, und auch die Organisation gehört zum künstlerischen Prozess. Einige Produktionen wurden gefördert, andere ganz aus eigener Kraft realisiert, doch das Programm richtete sich nie danach, was bewilligt wird. Die Eintrittspreise bleiben bewusst niedrig, weil Theater für alle zugänglich sein soll.


        Neben den Produktionen betreibt das Kollektiv eine kontinuierliche theaterpädagogische Arbeit: einen Schauspielkurs für Erwachsene und eine Werkstatt zu Regie, Theorie und Zuschauen.

        '
    - h: Förderung und Einladungen
      body: 'Produktionen von Tiyatro Berlin wurden unter anderem von der Senatsverwaltung für Kultur und Europa, dem Fonds Darstellende Künste und dem Goethe-Institut gefördert. Arbeiten des Kollektivs und seiner Mitglieder waren bei 48 Stunden Neukölln, beim Proud Haram Festival Berlin, beim Türkisch-Deutschen Theaterfestival, beim Theaterfestival Bergama und beim Internationalen Theaterfestival Istanbul eingeladen.

        '
    direction: Künstlerische Leitung
  en:
    title: About
    lead: Tiyatro Berlin is an independent theatre collective founded in Berlin in 2021. Since then it has played not only on stages but in bars, in parks and on the streets of the city, because Tiyatro Berlin believes that where a story is told matters as much as the story itself.
    sections:
    - h: Approach
      body: 'For Tiyatro Berlin, theatre is a public space in which a society works out what it remembers and what it would rather forget. The collective''s work starts from lives that no official history records, files that were quietly closed, and the things passed from one generation to the next without ever being said. The real question is how these experiences can reach the stage without being appropriated, and how respect for testimony can sit alongside a genuine encounter with an audience.


        This is why Tiyatro Berlin so often works with oral history, witness interviews and archival material, so that the theatre becomes a kind of counter-archive for stories that have no place elsewhere. The city, too, becomes material: on the audio walks, the audience moves right through the piece. Text, space, sound and performance are made together, around the same table. An arabesk song, a scene from an old film or a sentence overheard on the street can stand beside contemporary dramaturgy, because Tiyatro Berlin takes seriously the language the audience already brings with it.


        For the collective, independence is an aesthetic choice. Because it does not produce on behalf of an institution, it decides for itself what needs to be told, and keeps the freedom to try out forms that do not have a name yet.

        '
    - h: A place to begin
      body: 'Since 2021, more than fifteen performers, dramaturgs, sound and light artists have worked with Tiyatro Berlin. Almost all of them had spent years making theatre professionally in Turkey and had only just arrived in Berlin; for many, Tiyatro Berlin meant their first contract and first premiere in Germany.


        This was never announced as a programme, but over time it became the most important part of the work: a meeting place for artists to whom no institution opens its doors, and a network that makes them visible. Today Tiyatro Berlin is growing that network through projects that support arriving in the city, continued learning and connecting with one another.

        '
    - h: How it works
      body: 'Tiyatro Berlin has no office and no administrative staff; everyone here is an artist, and organising the work is part of the artistic process. Some productions were funded, others made entirely on the collective''s own means, but the programme has never been shaped by what gets approved. Ticket prices stay deliberately low, because theatre should remain open to everyone. Alongside the productions, the collective runs a year-round theatre education programme for adults.

        '
    direction: Artistic director
edu:
  tr:
    title: Tiyatro pedagojisi
    lead: Tiyatro Berlin, tiyatro pedagojisini sanatsal pratiğinin bir uzantısı olarak ele alıyor. Atölyeler, kolektifin provada geliştirdiği yöntemlerin ve dramaturji ile oyun analizi üzerine düşüncelerinin paylaşıldığı, sahne deneyimi olan ya da olmayan yetişkinlerle birlikte sınandığı bir çalışma alanı.
    body: 'Haftalık oyunculuk atölyesi bütün bir sezon boyunca sürüyor; ses, beden, nefes, doğaçlama ve metin çalışması, tiyatro tarihi ve dramaturji okumalarıyla iç içe ilerliyor. Tiyatroyu Okumak atölyesi ise reji anlayışlarını, tiyatro kuramlarını ve oyun metinlerini birlikte izlenen gösterilerle buluşturuyor.


      Bu odalarda tiyatroyu içeriden tanıyan ve sahneye eleştirel bir gözle bakan bir topluluk oluşuyor. Kolektif için atölyeler, oyunlarla aynı düşünce alanının parçası.

      '
  de:
    title: Theaterpädagogik
    lead: Tiyatro Berlin versteht Theaterpädagogik als Teil seiner künstlerischen Praxis. In den Kursen teilt das Kollektiv die Methoden, die es in seinen Proben entwickelt, und seine Auseinandersetzung mit Dramaturgie und Stückanalyse, und erprobt sie gemeinsam mit Erwachsenen mit und ohne Bühnenerfahrung.
    body: 'Der wöchentliche Schauspielkurs läuft über eine ganze Spielzeit; die Arbeit an Stimme, Körper, Atem, Improvisation und Text ist dabei eng mit der Lektüre von Theatergeschichte und Dramaturgie verbunden. Die Werkstatt Theater lesen verbindet Regieansätze, Theatertheorie und Stückanalyse mit gemeinsamen Aufführungsbesuchen.


      In diesen Räumen entsteht eine Gemeinschaft, die Theater von innen kennt und mit kritischem Blick auf die Bühne schaut. Für das Kollektiv gehören die Kurse zum selben Denkraum wie die Produktionen.

      '
  en:
    title: Theatre education
    lead: Tiyatro Berlin treats theatre education as an extension of its artistic practice. In the courses, the collective shares the methods it develops in rehearsal and its thinking on dramaturgy and play analysis, and tests them together with adults with and without stage experience.
    body: 'The weekly acting course runs across a whole season, with work on voice, body, breath, improvisation and text closely tied to readings in theatre history and dramaturgy. The Reading Theatre workshop brings approaches to directing, theatre theory and play analysis together with performances seen as a group.


      These rooms give rise to a community that knows theatre from the inside and looks at the stage with a critical eye. For the collective, the courses belong to the same space of thought as the productions.

      '

about:
  tr:
    title: Hakkımızda
    lead: Tiyatro Berlin, 2021'de Berlin'de bir araya gelen tiyatrocuların kurduğu bağımsız bir kolektif. Kuruluşundan bu yana oyunlarını yalnızca sahnelerde değil, barlarda, parklarda ve şehrin sokaklarında da oynuyor; çünkü bir hikâyenin nerede anlatıldığının, ne anlatıldığı kadar önemli olduğuna inanıyor.
    sections:
      - h: Yaklaşım
        body: |
          Tiyatro Berlin için tiyatro, bir toplumun neyi hatırlayıp neyi unutmayı seçtiğini tartıştığı kamusal bir alan. Resmî tarihin kayda geçirmediği hayatlar, sessizce kapatılmış dosyalar, bir kuşaktan ötekine söylenmeden aktarılan şeyler kolektifin çalışmalarının çıkış noktası. Asıl mesele, bu deneyimleri sahneye taşırken onları sahiplenmemek, tanıklığa saygıyı korurken seyirciyle gerçek bir karşılaşma kurabilmek.

          Bu yüzden Tiyatro Berlin çoğu zaman sözlü tarihle, tanık görüşmeleriyle ve arşiv belgeleriyle çalışıyor ve tiyatroyu, başka yerde yer bulamayan anlatıların sığındığı bir karşı-arşiv olarak görüyor. Şehir onun için bir dekor değil, oyunun kendisi: kulaklıklı yürüyüşlerde seyirci izlemeyi bırakıp oyunun içinde yürümeye başlıyor. Metin, mekân, ses ve oyunculuk aynı masa etrafında, birlikte üretiliyor. Bir arabesk şarkı, eski bir film sahnesi ya da sokakta duyulmuş bir cümle çağdaş dramaturjiyle aynı sahnede durabiliyor; Tiyatro Berlin, seyircinin zaten yanında getirdiği bu dili ciddiye alıyor.

          Kolektif, bağımsızlığı bir zorunluluktan çok estetik bir tercih olarak görüyor. Bir kurum adına üretmediği için hangi konunun fonlanabilir olduğunu değil, neyin anlatılması gerektiğini sorabiliyor ve henüz adı konmamış biçimleri deneme özgürlüğünü koruyabiliyor.
      - h: Başlangıç için bir yer
        body: |
          2021'den bu yana on beşten fazla oyuncu, dramaturg, ses ve ışık sanatçısı Tiyatro Berlin'de çalıştı. Neredeyse hepsi Türkiye'de yıllarca profesyonel tiyatro yapmış, Berlin'e ise yeni gelmişti; çoğu için Tiyatro Berlin, Almanya'daki ilk sözleşme ve ilk prömiyer anlamına geldi.

          Bu hiçbir zaman bir program olarak ilan edilmedi, ama zamanla kolektifin işinin en önemli yanı hâline geldi: hiçbir kurumun kapısını açmadığı sanatçılar için bir buluşma yeri ve onları görünür kılan bir ağ. Tiyatro Berlin bugün bu ağı, yeni gelenlerin şehre yerleşmesini, öğrenmeyi ve birbirine bağlanmayı destekleyen projelerle büyütüyor.
      - h: Çalışma biçimi
        body: |
          Tiyatro Berlin'in bir ofisi ya da idari kadrosu yok; burada çalışan herkes aynı zamanda sanatçı, işin örgütlenmesi de sanatsal sürecin bir parçası. Oyunların bir kısmı fonla, bir kısmı tamamen kolektifin kendi imkânlarıyla üretildi; ama program hiçbir zaman neyin onaylanacağına göre belirlenmedi. Bilet fiyatları da bilerek düşük tutuluyor, çünkü Tiyatro Berlin tiyatronun herkese açık kalması gerektiğine inanıyor.

          Oyunların yanında yıl boyu süren bir tiyatro pedagojisi programı da yürütülüyor: iki seviyede yetişkin oyunculuk atölyesi, dramaturji ve oyun inceleme, komedi yazımı.
    direction: "Genel sanat yönetmeni"
  de:
    title: Über uns
    lead: Tiyatro Berlin ist ein freies Theaterkollektiv, das sich 2021 in Berlin gegründet hat. Seitdem spielt es nicht nur auf Bühnen, sondern auch in Bars, in Parks und auf den Straßen der Stadt, denn Tiyatro Berlin ist überzeugt, dass der Ort, an dem eine Geschichte erzählt wird, genauso viel bedeutet wie die Geschichte selbst.
    sections:
      - h: Haltung
        body: |
          Für Tiyatro Berlin ist Theater ein öffentlicher Raum, in dem eine Gesellschaft aushandelt, woran sie sich erinnert und was sie lieber vergisst. Ausgangspunkt der Arbeit sind Lebensgeschichten, die in keiner offiziellen Chronik vorkommen, Akten, die stillschweigend geschlossen wurden, und das, was von einer Generation zur nächsten weitergegeben wird, ohne je ausgesprochen zu werden. Die eigentliche Frage ist dabei, wie diese Erfahrungen auf die Bühne kommen können, ohne vereinnahmt zu werden, und wie sich der Respekt vor dem Zeugnis mit einer echten Begegnung zwischen Bühne und Publikum verbinden lässt.

          Deshalb arbeitet das Kollektiv häufig mit Oral History, mit Zeitzeug*innen-Interviews und mit Archivmaterial; das Theater wird so zu einer Art Gegenarchiv, in dem Erzählungen Zuflucht finden, die anderswo keinen Platz haben. Die Stadt ist dabei keine Kulisse, sondern Material: In den Audiowalks hört das Publikum auf zuzuschauen und beginnt, im Stück mitzugehen. Text, Raum, Klang und Spiel entstehen gemeinsam am selben Tisch. Ein Arabesk-Lied, eine Szene aus einem alten Film oder ein auf der Straße aufgeschnappter Satz können neben zeitgenössischer Dramaturgie bestehen, denn Tiyatro Berlin nimmt die Sprache ernst, die das Publikum ohnehin mitbringt.

          Unabhängigkeit versteht das Kollektiv weniger als Mangel denn als ästhetische Entscheidung. Weil es nicht im Auftrag einer Institution produziert, kann es fragen, was erzählt werden muss, statt was förderfähig ist, und sich die Freiheit bewahren, Formen zu erproben, für die es noch keinen Namen gibt.
      - h: Ein Ort für den Anfang
        body: |
          Seit 2021 haben mehr als fünfzehn Darsteller*innen, Dramaturg*innen sowie Licht- und Klangkünstler*innen bei Tiyatro Berlin gearbeitet. Fast alle hatten zuvor jahrelang professionell in der Türkei Theater gemacht und waren gerade erst in Berlin angekommen; für viele bedeutete Tiyatro Berlin den ersten Vertrag und die erste Premiere in Deutschland.

          Als Programm wurde das nie ausgerufen, doch mit der Zeit ist es zum wichtigsten Teil der Arbeit geworden: ein Treffpunkt für Künstler*innen, denen keine Institution die Tür öffnet, und ein Netzwerk, das sie sichtbar macht. Heute baut Tiyatro Berlin dieses Netzwerk mit eigenen Projekten aus, die das Ankommen in der Stadt, das Weiterlernen und die gegenseitige Vernetzung unterstützen.
      - h: Arbeitsweise
        body: |
          Tiyatro Berlin hat weder ein Büro noch eine Verwaltung; alle, die hier arbeiten, sind Künstler*innen, und auch die Organisation gehört zum künstlerischen Prozess. Einige Produktionen wurden gefördert, andere ganz aus eigener Kraft realisiert, doch das Programm richtete sich nie danach, was bewilligt wird. Die Eintrittspreise bleiben bewusst niedrig, weil Theater für alle zugänglich sein soll.

          Neben den Produktionen betreibt das Kollektiv eine kontinuierliche theaterpädagogische Arbeit mit Ensembles für Erwachsene auf zwei Niveaus, Werkstätten zu Dramaturgie und Stückanalyse sowie einem Kurs für Comedy-Schreiben.
      - h: Förderung und Einladungen
        body: |
          Produktionen von Tiyatro Berlin wurden unter anderem von der Senatsverwaltung für Kultur und Europa, dem Fonds Darstellende Künste und dem Goethe-Institut gefördert. Arbeiten des Kollektivs und seiner Mitglieder waren bei 48 Stunden Neukölln, beim Proud Haram Festival Berlin, beim Türkisch-Deutschen Theaterfestival, beim Theaterfestival Bergama und beim Internationalen Theaterfestival Istanbul eingeladen.
    direction: "Künstlerische Leitung"
  en:
    title: About
    lead: Tiyatro Berlin is an independent theatre collective founded in Berlin in 2021. Since then it has played not only on stages but in bars, in parks and on the streets of the city, because Tiyatro Berlin believes that where a story is told matters as much as the story itself.
    sections:
      - h: Approach
        body: |
          For Tiyatro Berlin, theatre is a public space in which a society works out what it remembers and what it would rather forget. The collective's work starts from lives that no official history records, files that were quietly closed, and the things passed from one generation to the next without ever being said. The real question is how these experiences can reach the stage without being appropriated, and how respect for testimony can sit alongside a genuine encounter with an audience.

          This is why Tiyatro Berlin so often works with oral history, witness interviews and archival material, so that the theatre becomes a kind of counter-archive for stories that have no place elsewhere. The city is not a backdrop but material: on the audio walks, the audience stops watching and starts walking through the piece. Text, space, sound and performance are made together, around the same table. An arabesk song, a scene from an old film or a sentence overheard on the street can stand beside contemporary dramaturgy, because Tiyatro Berlin takes seriously the language the audience already brings with it.

          The collective treats independence less as a shortage than as an aesthetic choice. Because it does not produce on behalf of an institution, it can ask what needs to be told rather than what can be funded, and keep the freedom to try out forms that do not have a name yet.
      - h: A place to begin
        body: |
          Since 2021, more than fifteen performers, dramaturgs, sound and light artists have worked with Tiyatro Berlin. Almost all of them had spent years making theatre professionally in Turkey and had only just arrived in Berlin; for many, Tiyatro Berlin meant their first contract and first premiere in Germany.

          This was never announced as a programme, but over time it became the most important part of the work: a meeting place for artists to whom no institution opens its doors, and a network that makes them visible. Today Tiyatro Berlin is growing that network through projects that support arriving in the city, continued learning and connecting with one another.
      - h: How it works
        body: |
          Tiyatro Berlin has no office and no administrative staff; everyone here is an artist, and organising the work is part of the artistic process. Some productions were funded, others made entirely on the collective's own means, but the programme has never been shaped by what gets approved. Ticket prices stay deliberately low, because theatre should remain open to everyone. Alongside the productions, the collective runs a year-round theatre education programme for adults.
    direction: "Artistic director"

edu:
  tr:
    title: Tiyatro pedagojisi
    lead: Tiyatro Berlin'in atölyelerini, sahnenin hem önünde hem arkasında çalışan kolektif üyeleri yürütüyor. Katılımcılar oyunculuğu burada bir ders kitabından değil, her gün sahnede bu işi yapan insanlardan öğreniyor.
    body: |
      Daha önce hiç sahneye çıkmamış yetişkinler için de, devam etmek isteyenler için de ayrı bir grup var. Gruplar bir sezon boyunca her hafta aynı odada buluşuyor ve sesle, bedenle, nefesle, doğaçlamayla ve metinle çalışırken tiyatronun tarihine ve dramaturjisine de kafa yoruyor.

      Tiyatro Berlin, tiyatro pedagojisini bir yan faaliyet olarak görmüyor. Tiyatroyu içeriden tanıyan, oyunlara başka gözle bakan bir seyirci bu odalarda oluşuyor ve bu, kolektif için en az bir prömiyer kadar değerli.
  de:
    title: Theaterpädagogik
    lead: Die Kurse von Tiyatro Berlin leiten Mitglieder des Kollektivs, die selbst vor und hinter der Bühne arbeiten. Wer hier spielen lernt, lernt es also nicht aus dem Lehrbuch, sondern von Menschen, für die das Theater tägliche Praxis ist.
    body: |
      Es gibt Ensembles für Erwachsene, die noch nie auf einer Bühne standen, ebenso wie für Fortgeschrittene. Die Gruppen treffen sich eine ganze Spielzeit lang jede Woche im selben Raum und arbeiten mit Stimme, Körper, Atem, Improvisation und Text, während sie sich zugleich mit Theatergeschichte und Dramaturgie auseinandersetzen.

      Für Tiyatro Berlin ist Theaterpädagogik kein Nebenangebot. In diesen Räumen entsteht ein Publikum, das Theater von innen kennt und anders auf die Bühne schaut, und das ist dem Kollektiv mindestens so viel wert wie eine Premiere.
  en:
    title: Theatre education
    lead: Tiyatro Berlin's courses are led by members of the collective who work both in front of and behind the stage, so participants learn acting not from a textbook but from people for whom theatre is daily practice.
    body: |
      There are ensembles for adults who have never been on a stage as well as for those who want to go further. The groups meet every week in the same room for a whole season, working with voice, body, breath, improvisation and text while also engaging with theatre history and dramaturgy.

      For Tiyatro Berlin, theatre education is not a side activity. These rooms are where an audience forms that knows theatre from the inside and looks at the stage differently, and to the collective that matters at least as much as a premiere.

  - slug: tiyatroyu-okumak
    title: {tr: "Tiyatroyu Okumak · Reji, kuram ve seyir atölyesi", de: "Theater lesen · Werkstatt für Regie, Theorie und Zuschauen", en: "Reading Theatre · A workshop in directing, theory and spectatorship"}
    text:
      tr: |
        Tiyatroyu izlemekten bir adım ileri gitmek isteyenler için on bir haftalık bir okuma ve yazı atölyesi. Oyunlar birlikte izleniyor, metin ve sahneleme adım adım çözümleniyor, aynı oyun farklı kuramların gözünden okunuyor ve görülenler yazıya dökülüyor.

        Atölye dramaturjiyle sosyolojiyi yan yana getiriyor: sahnede olana hem kurgusu hem de doğduğu toplumsal bağlam açısından bakılıyor. Ufkundaki seyirci, beğendim ya da beğenmedim demek yerine oyunda ne gördüğünü ve neden öyle düşündüğünü anlatabilen, iyi soru soran bir seyirci. Ön bilgi gerekmiyor; tek şart merak.
      de: |
        Eine elfwöchige Lese- und Schreibwerkstatt für alle, die beim Theater einen Schritt weiter gehen wollen als das Zuschauen. Aufführungen werden gemeinsam besucht, Text und Inszenierung Schritt für Schritt analysiert, dasselbe Stück wird mit verschiedenen Theorien gelesen, und das Gesehene wird aufgeschrieben.

        Die Werkstatt verbindet Dramaturgie und Soziologie: Sie fragt nach dem Bau einer Aufführung und nach dem gesellschaftlichen Zusammenhang, in dem sie entsteht. Ihr Ziel ist ein Publikum, das gute Fragen stellt und begründen kann, was es gesehen hat, statt nur zu sagen, ob es gefallen hat. Vorkenntnisse sind nicht nötig, nur Neugier.
      en: |
        An eleven-week reading and writing workshop for anyone who wants to go a step beyond watching theatre. Performances are seen together, text and staging are analysed step by step, the same play is read through different theories, and what was seen is put into writing.

        The workshop brings dramaturgy and sociology together: it looks at how a performance is built and at the social context it comes from. Its aim is a spectator who asks good questions and can say what they saw and why they think so, rather than simply whether they liked it. No prior knowledge is needed, only curiosity.
    level: {tr: "Yetişkinler için, ön bilgi gerekmez", de: "Für Erwachsene, ohne Vorkenntnisse", en: "For adults, no prior knowledge needed"}

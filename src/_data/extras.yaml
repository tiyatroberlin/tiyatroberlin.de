  - slug: tiyatroyu-okumak
    title: {tr: "Tiyatroyu Okumak · Reji, kuram ve seyir atölyesi", de: "Theater lesen · Werkstatt für Regie, Theorie und Zuschauen", en: "Reading Theatre · A workshop in directing, theory and spectatorship"}
    text:
      tr: |
        Bir oyunu izlerken neyin bizi yakaladığını, bir metnin sahnede nasıl başka bir şeye dönüştüğünü, bir rejinin hangi kararlarla kurulduğunu birlikte soran bu atölye, tiyatroya sahnenin hem önünden hem arkasından bakmak isteyenler için kuruldu. On iki hafta boyunca reji anlayışları ve tiyatro kuramları konuşuluyor, oyun metinleri satır satır çözümleniyor, oyunlar birlikte izlenip ardından tartışılıyor.

        Atölyenin ufkunda iyi bir seyirci olmak var: gördüğünü okuyabilen, bir gösterinin nasıl kurulduğunu fark eden ve üzerine söz alabilen bir seyirci. Ön bilgi gerekmiyor; yönetmenliğe, yazarlığa ya da eleştiriye merak duyanlar kadar tiyatroyu yalnızca daha derinden izlemek isteyenler de davetli.
      de: |
        Was uns an einer Aufführung packt, wie sich ein Text auf der Bühne in etwas anderes verwandelt, aus welchen Entscheidungen eine Inszenierung entsteht: Diesen Fragen geht die Werkstatt gemeinsam nach, für alle, die Theater zugleich von vorne und von hinten sehen wollen. Zwölf Wochen lang geht es um Regieansätze und Theatertheorien, Stücktexte werden Zeile für Zeile gelesen, Aufführungen gemeinsam besucht und danach diskutiert.

        Am Horizont steht das gute Zuschauen: ein Publikum, das lesen kann, was es sieht, erkennt, wie eine Aufführung gebaut ist, und darüber sprechen kann. Vorkenntnisse sind nicht nötig; eingeladen sind alle, die sich für Regie, Schreiben oder Kritik interessieren, ebenso wie alle, die Theater einfach genauer sehen möchten.
      en: |
        What grips us in a performance, how a text turns into something else on stage, which decisions a production is built from: the workshop asks these questions together, for anyone who wants to see theatre from the front and from behind at the same time. Over twelve weeks it covers approaches to directing and theories of theatre, reads play texts line by line, and goes to see performances together to discuss them afterwards.

        On its horizon is good spectatorship: an audience that can read what it sees, notices how a performance is built and can speak about it. No prior knowledge is needed; the workshop is open to anyone curious about directing, writing or criticism, and just as much to those who simply want to watch theatre more closely.

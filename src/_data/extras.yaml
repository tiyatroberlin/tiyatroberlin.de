  - slug: dramaturji-atolyesi
    title: {tr: "Sahneyi Düşünmek · Dramaturji Atölyesi", de: "Bühne denken · Dramaturgie-Werkstatt", en: "Thinking the Stage · Dramaturgy workshop"}
    text:
      tr: |
        Bir gösterinin bizi neden yakaladığını, bir metnin sahnede nasıl başka bir şeye dönüştüğünü, bir rejinin hangi kararlarla kurulduğunu sormak dramaturjinin alanıdır. Bu atölye, tiyatroya oyunculuğun dışından da bakmak isteyenlere on iki hafta boyunca okumaya, tartışmaya ve yazmaya dayalı bir çalışma alanı açıyor.

        Hat, tiyatro kuramlarından Osmanlı döneminden bugüne Türkiye tiyatrosunun dönüşümlerine, temel metinlerin çözümlenmesinden eleştiri yazımına uzanıyor. Atölye ön bilgi gerektirmiyor; tiyatroyu seyirci, yazar, oyuncu ya da yönetmen olarak daha derinden düşünmek isteyen herkese açık.
      de: |
        Warum uns eine Aufführung packt, wie sich ein Text auf der Bühne in etwas anderes verwandelt, aus welchen Entscheidungen eine Inszenierung entsteht: Das ist das Feld der Dramaturgie. Die Werkstatt öffnet zwölf Wochen lang einen Raum zum Lesen, Diskutieren und Schreiben für alle, die Theater auch jenseits des Spielens verstehen wollen.

        Der Bogen reicht von Theatertheorien über die Geschichte des Theaters in der Türkei, vom Osmanischen Reich bis heute, bis zur Analyse grundlegender Texte und zum Schreiben von Kritiken. Vorkenntnisse sind nicht nötig; die Werkstatt richtet sich an alle, die Theater als Zuschauende, Schreibende, Spielende oder Inszenierende genauer denken möchten.
      en: |
        Why a performance grips us, how a text turns into something else on stage, which decisions a production is built from: this is the field of dramaturgy. Over twelve weeks the workshop opens a space for reading, discussion and writing for anyone who wants to understand theatre beyond acting as well.

        The arc runs from theories of theatre through the history of theatre in Turkey, from the Ottoman period to today, to the close analysis of key texts and the writing of criticism. No prior knowledge is needed; the workshop is open to anyone who wants to think about theatre more deeply, as a spectator, writer, performer or director.
    level: {tr: "Yetişkinler için, ön bilgi gerekmez", de: "Für Erwachsene, ohne Vorkenntnisse", en: "For adults, no prior knowledge needed"}

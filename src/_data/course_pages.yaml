        5. İlk derste katılım sözleşmesi imzalanır.
    - id: ilk-ders
      h: İlk ders günü
      md: |
        - 18:30'da mekânda olun; ilk akşam tanışma ve sözleşmeyle başlıyor.
        - Yanınızda defter ve kalem olsun.
    - id: ilkeler
      h: Birlikte çalışma ilkeleri
      md: |
        - Her dersin sonunda gelecek haftanın metni ve kavramları belirlenir; tartışmanın zemini bu hazırlık.
        - Farklı görüşler atölyenin malzemesi; her görüş dinlenir.
        - Telefonlar ders süresince sessizdedir.
    - id: donem-sonu
      h: Dönem sonu
      md: |
        - Her katılımcı izlediği oyunlardan biri üzerine kısa bir eleştiri yazısı ya da deneme yazar; yazılar dönem içinde birlikte okunur ve değerlendirilir.
        - İsteyen, dönem boyunca yazdıklarını bir dosyada toplayabilir.
        - Grubun dinamiğine bağlı olarak katılımcılar kısa bir sahne de yazar; isteyen bu sahneyi dönemden sonra eğitmenle birlikte geliştirebilir.
        - Her katılımcıya katılım belgesi verilir.
    - id: mekan
      h: Mekân ve ulaşım
      md: |
        Atölyenin yapılacağı mekân daha sonra duyurulacak; kayıt olanlara ayrıca bildirilir.
  faq:
    - ["Hiç bilgim yok, katılabilir miyim?", "Evet. Ön bilgi gerekmiyor; merak ve katılım yeterli."]
    - ["Oyunlara mutlaka gitmem gerekiyor mu?", "Hayır. Oyuna gitmeyenler de sınıftaki çözümlemelere ve tartışmalara katılabiliyor."]
    - ["Oyunculuk Atölyesi'ne de devam ediyorum, bu atölye bana ne katar?", "Rolün ötesinde oyunun bütününü okumayı: karakterin engellerini, öteki karakterlerle, zamanla ve metinle ilişkisini. İki atölye farklı günlerde ve birbirini besliyor."]
    - ["Oyun biletleri ne kadar tutar?", "Biletler mekâna göre değişiyor ve kurs ücretine dahil değil."]

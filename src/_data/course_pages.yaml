- slug: tiyatroyu-okumak
  subtitle: Reji, kuram ve seyir atölyesi · Her salı
  image: oyun/atolye.jpg
  facts:
    - [Gün ve saat, "Salı, 19:00–21:00"]
    - [Dönem, "12 Ocak – 30 Mart 2027"]
    - [Ders sayısı, "11 ders, toplam 22 saat"]
    - [Yer, Daha sonra duyurulacak]
    - [Dil, Türkçe]
    - [Düzey, Ön bilgi gerekmez]
    - [Yaş, 18 yaş ve üstü]
    - [Ücret, "Aylık 80 €, havale ile, fatura karşılığı"]
  sections:
    - id: hakkinda
      h: Kurs hakkında
      md: |
        Bir gösterinin bizi neden yakaladığını, bir metnin sahnede nasıl başka bir şeye dönüştüğünü, bir rejinin hangi kararlarla kurulduğunu birlikte soran bu atölye, tiyatroya sahnenin hem önünden hem arkasından bakmak isteyenler için kuruldu. On iki hafta boyunca reji anlayışları ve tiyatro kuramları konuşuluyor, oyun metinleri satır satır çözümleniyor, oyunlar birlikte izlenip ardından tartışılıyor.

        Atölyenin ufkunda iyi bir seyirci olmak var: gördüğünü okuyabilen, bir gösterinin nasıl kurulduğunu fark eden ve üzerine söz alabilen bir seyirci.
    - id: kimler-icin
      h: Kimler için
      md: |
        - Tiyatroyu daha derinden izlemek ve anlamak isteyen seyirciler
        - Yönetmenliğe, yazarlığa, dramaturjiye ya da eleştiriye merak duyanlar
        - Oyunculuk Atölyesi'ne katılan ve sahnenin düşünce tarafını da öğrenmek isteyenler
    - id: kazanimlar
      h: Kurs sonunda neler kazanılır
      md: |
        - Bir oyun metnini yapısı, karakterleri ve alt metniyle çözümleyebilmek
        - Bir gösterinin reji kararlarını okuyabilmek: mekân, oyunculuk, ritim, ışık, ses
        - 20. yüzyılın belli başlı tiyatro kuramlarını ve akımlarını tanımak
        - Türkiye tiyatrosunun dönüşümünü tarihsel bir çerçevede görebilmek
        - İzlediği bir gösteri üzerine kısa bir eleştiri metni yazabilmek
    - id: mufredat
      h: Müfredat
      md: |
        - Reji anlayışları ve tiyatro kuramları
        - Oyun metni çözümleme
        - Birlikte oyun izleme ve tartışma
        - Türkiye ve dünya tiyatro tarihi
        - Eleştiri yazımı

        Haftalık okuma listesi ve izlenecek oyunlar ilk derste paylaşılır.
    - id: ders-aksami
      h: Bir ders akşamı nasıl geçer
      md: |

    - id: ucret
      h: Ücret ve ödeme
      md: |
        - Aylık 80 €; Ocak, Şubat ve Mart için üç ödeme, toplam 240 €.
        - Ödeme her ayın ilk dersinden önce banka havalesiyle yapılır; her ödeme için fatura düzenlenir.
        - Birlikte izlenen oyunların biletleri kurs ücretine dahil değil.
        - İndirim ve deneme dersi uygulanmaz; kaçırılan dersler için iade yapılmaz.
    - id: kayit
      h: Kayıt adımları

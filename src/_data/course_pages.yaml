- slug: tiyatroyu-okumak
  subtitle: Reji, kuram ve seyir atölyesi · Her salı
  image: oyun/atolye.jpg
  facts:
    - [Gün ve saat, "Salı, 18:45–21:00 (kapı 18:30)"]
    - [Dönem, "12 Ocak – 30 Mart 2027"]
    - [Ders sayısı, "11 ders"]
    - [Yer, Daha sonra duyurulacak]
    - [Dil, Türkçe]
    - [Düzey, "Ön bilgi gerekmez"]
    - [Yaş, 18 yaş ve üstü]
    - [Ücret, "Aylık 80 €, havale ile, fatura karşılığı"]
  sections:
    - id: hakkinda
      h: Kurs hakkında
      md: |
        Tiyatroyu Okumak, tiyatroyu izlemekten bir adım ileri gitmek isteyenler için on bir haftalık bir okuma ve yazı atölyesi. Oyunlar birlikte izleniyor, metin ve sahneleme adım adım çözümleniyor, aynı oyun farklı kuramların gözünden okunuyor ve görülenler yazıya dökülüyor. On bir haftanın sonunda oyun, izlenip geçilen bir şey olmaktan çıkıyor; çözülebilecek bir bulmacaya dönüşüyor.

        Atölye dramaturjiyle sosyolojiyi yan yana getiriyor: sahnede olana hem kurgusu hem de doğduğu toplumsal bağlam açısından bakılıyor. Tiyatro burada yalnızca sahnede olup biten bir şey sayılmıyor, toplumsal bir olgu olarak da ele alınıyor: kim, kime, hangi koşullarda, ne söylüyor?

        Atölyenin ufkundaki seyirci her şeyi bilen biri olmak zorunda değil; iyi soru sorabilen biri. Oyunu nasıl buldun sorusuna beğendim ya da beğenmedim demek yerine, oyunda ne gördüğünü ve neden öyle düşündüğünü anlatabilen bir seyirci.

        Atölye, Tiyatro Berlin'in sanatsal pratiğinin bir uzantısı: seyirciyle tiyatro üzerine birlikte düşünmenin ve konuşmanın bir yolu.
    - id: kimler-icin
      h: Kimler için
      md: |
        - Tiyatroyu seven ve nasıl okunur diye merak eden seyirciler
        - Oyunculuk Atölyesi'ne katılanlar ya da katılmayı düşünenler
        - Oyun yazmak, eleştiri yazmak ya da dramaturjiyle ilgilenenler
        - Tiyatro üzerine düşünürken kendine bir yol arayan öğrenciler ve meraklılar
        - Berlin'de Türkçe üretilen bir sanat ortamının izleyicisi ve düşünce ortağı olmak isteyenler

        Ön bilgi gerekmiyor; tek şart merak. Kavramlar sırayla, birlikte inceleniyor.
    - id: kazanimlar
      h: Kurs sonunda neler kazanılır
      md: |
        - Bir oyun metnine yapı, karakter, dil ve alt metin üzerinden bakabilmek
        - Sahnede yazarın, yönetmenin ve sahnenin ne dediğini birbirinden ayırabilmek
        - Aynı oyunu toplumsal cinsiyet, sınıf, psikanaliz ve göstergebilim gibi farklı bakışlarla okuyabilmek
        - Karakter ve beat analizinin temel araçlarını kullanabilmek
        - Betimlemeyle yorumu, kişisel beğeniyle gerekçeli yargıyı ayırabilmek
        - Tiyatro tarihini ve Türkiye tiyatrosunun dönüşümünü ana hatlarıyla tanımak
        - Kısa bir eleştiri yazısı ya da deneme yazmış olmak
    - id: mufredat
      h: Akış
      md: |
        Dönem, her biri bir oyun etrafında dönen dört bölümden oluşuyor.

        **Tiyatroyu nasıl okuruz? · 1–2. hafta**

        - Dramaturji nedir, dramaturg ne yapar
        - Özet, yorum ve çözümleme arasındaki fark
        - Dramatik yapı: Aristotelesçi, epik ve parçalı yapılar

        **Metin ve karakter · 3–5. hafta**

        - Birinci oyun üzerinde metin okuması: yapı, zaman, mekân, dil, alt metin
        - Karakter analizi: süper hedef, hedef, engel, eylem
        - Beat analizi: bir sahneyi anlam ve niyet değişimlerine bölmek
        - Ortak izleme ve izleme sonrası konuşma

        **Kuramlarla okumak · 6–8. hafta**

        - İkinci oyun üzerinde farklı okumalar: toplumsal cinsiyet ve feminist eleştiri, sosyolojik ve Marksist eleştiri, psikanalitik okuma, göstergebilim, alımlama estetiği
        - Aynı oyuna başka bir bakışla bakınca neyin görünür, neyin görünmez olduğu
        - Yazar ne istedi, yönetmen ne istedi, sahnede ne görüldü?

        **Yazmak · 9–11. hafta**

        - Eleştiri, deneme ve çözümleme yazısının farkları
        - İyi bir eleştirinin anatomisi; eleştiri gibi görünen ama eleştiri olmayan yazılar
        - Üçüncü oyun ve katılımcıların kendi yazıları: birlikte okuma, karşılıklı geri bildirim
        - Dönemin birlikte değerlendirilmesi

        **Dönem boyunca süren hat: tiyatro tarihi ve Türkiye tiyatrosu**

        Her akşamın bir bölümü tiyatronun tarihine ve düşüncesine ayrılıyor: Antik Yunan'dan Lessing'e ve Brecht'e, oradan postdramatik tiyatroya ve dijital sanata; meddah, Karagöz ve ortaoyunundan Tanzimat'a, Cumhuriyet dönemine, devlet ve şehir tiyatrolarından bugünün alternatif sahnelerine. Tiyatronun toplumla, kurumla ve seyirciyle ilişkisi sosyolojik bir gözle ele alınıyor.

        Yol arkadaşları arasında Aristoteles, Lessing, Brecht, Stanislavski, Judith Butler, Hans-Thies Lehmann ve Patrice Pavis var.
    - id: izleme
      h: Birlikte oyun izleme
      md: |
        - Yaklaşık dört beş haftada bir, katılımcılarla birlikte seçilen bir oyun izleniyor; katılım isteğe bağlı.
        - İzlemeden önce derste yazar, dönem ve yönetmenin önceki işleri konuşuluyor; katılımcı oyuna bu hazırlıkla gidiyor.
        - İzlemeden sonra önce akılda ne kaldığı konuşuluyor, ardından niyetle sonuç arasındaki boşluklara bakılıyor: yazar ne istemiş, yönetmen ne söylemiş, sahnede ne görüldü, bu oyun başka nasıl sahnelenirdi?
        - Oyuna gidemeyen katılımcılar metin ve tartışma üzerinden atölyeye katılıyor.
    - id: calisma-bicimi
      h: Çalışma biçimi
      md: |
        - Tek bir doğru okuma yok; her okuma gerekçesiyle savunuluyor. Bir oyun psikanalitik bir bakışla da, toplumsal cinsiyet rolleri üzerinden de okunabiliyor.
        - Atölye katılımcıya tek bir bakış öğretmiyor, bir alet çantası veriyor: betimleme, çözümleme ve yorumlama araçları.
        - Bilgi tek yönlü aktarılmıyor. Atölye cahil hoca fikrinden yola çıkıyor: eğitmen bildiğini anlatıyor, tartışma herkesin birlikte öğrendiği bir alan açıyor.
        - Katılımcılar küçük dramaturji alıştırmaları yapıyor: bir sahneyi beat'lere bölüyor, karakterin hedef ve engellerini çıkarıyor, ben olsam nasıl sahnelerdim sorusuyla reji notları yazıyor.
        - Katılımcı bir prova sürecindeki dramaturg gibi düşünmeyi deniyor: kendi okumasını kuruyor, gerekçelendiriyor ve yönetmene söyleyecek sözünü hazırlıyor.
        - Grubun dinamiğine bağlı olarak bir metin seçilip küçük bir sahneleme denemesi yapılabiliyor: bu metin daha önce nasıl yorumlanmış, grup onu sahneye nasıl taşırdı?

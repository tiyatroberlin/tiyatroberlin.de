tr: {press: Basın, text: "Oyunlar, turne davetleri, ortak yapımlar ve basın soruları için bize yazın. Fotoğraf ve basın dosyası istekleri de aynı adrese.", form_h: Bize yazın, name: Adınız, email: E-posta adresiniz, topic: Konu, topics: [Genel, Bilet ve gösterimler, Kurslar, Basın, Davet ve ortak yapım], message: Mesajınız, consent: "Mesajımın yanıtlanması için bilgilerimin kullanılmasını kabul ediyorum.", privacy: Gizlilik, send: Gönder, sending: Gönderiliyor…, ok: "Teşekkürler, mesajınız ulaştı. En kısa sürede yanıt vereceğiz.", err: "Mesaj gönderilemedi. Lütfen doğrudan info@tiyatroberlin.de adresine yazın.", direct: Doğrudan}
de: {press: Presse, text: "Für Gastspieleinladungen, Koproduktionen und Presseanfragen schreiben Sie uns. Fotos und Pressematerial schicken wir gern auf Anfrage.", form_h: Schreiben Sie uns, name: Ihr Name, email: Ihre E-Mail-Adresse, topic: Thema, topics: [Allgemein, Tickets und Vorstellungen, Kurse, Presse, Einladungen und Koproduktionen], message: Ihre Nachricht, consent: "Ich bin einverstanden, dass meine Angaben zur Beantwortung meiner Nachricht verwendet werden.", privacy: Datenschutz, send: Senden, sending: Wird gesendet…, ok: "Danke, Ihre Nachricht ist angekommen. Wir melden uns so bald wie möglich.", err: "Die Nachricht konnte nicht gesendet werden. Bitte schreiben Sie direkt an info@tiyatroberlin.de.", direct: Direkt}
en: {press: Press, text: "Write to us about touring invitations, co-productions and press enquiries. Photos and press material are available on request.", form_h: Write to us, name: Your name, email: Your email, topic: Subject, topics: [General, Tickets and performances, Courses, Press, Invitations and co-productions], message: Your message, consent: "I agree that my details are used to answer my message.", privacy: Privacy, send: Send, sending: Sending…, ok: "Thank you, your message has arrived. We will reply as soon as we can.", err: "The message could not be sent. Please write directly to info@tiyatroberlin.de.", direct: Directly}

tr: {press: Basın, text: "Oyunlar, turne davetleri, ortak yapımlar ve basın soruları için bize yazın. Fotoğraf ve basın dosyası istekleri de aynı adrese."}
de: {press: Presse, text: "Für Gastspieleinladungen, Koproduktionen und Presseanfragen schreiben Sie uns. Fotos und Pressematerial schicken wir gern auf Anfrage."}
en: {press: Press, text: "Write to us about touring invitations, co-productions and press enquiries. Photos and press material are available on request."}

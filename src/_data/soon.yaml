# Yakında: henüz programa girmemiş yeni işler
- slug: nameless
  title: NAMELESS
  venue: ballhaus
  by: "cabinet:novus"
  form: {tr: Kulaklıklı yürüyüş, de: Audiowalk, en: Audio walk}
  text:
    tr: Kulaklıklarını takan on kişilik küçük bir grup, bir kadının hayatını şehrin sokaklarında, adım adım dinleyerek izliyor. Yürüyüş Almanca ve Türkçe dinlenebiliyor.
    de: Eine Gruppe von zehn Personen setzt die Kopfhörer auf und folgt Schritt für Schritt dem Leben einer Frau durch die Straßen der Stadt. Der Walk ist auf Deutsch und auf Türkisch zu hören.
    en: A small group of ten puts on headphones and follows, step by step, the life of a woman through the streets of the city. The walk can be heard in German and in Turkish.
- slug: throniva
  title: THRONIVA
  venue: ballhaus
  form: {tr: "Sözsüz oyun · bir yüzyılın başlangıcına dair", de: "Stück ohne Worte · eine Analyse des Jahrhundertbeginns", en: "A wordless piece · an analysis of the turn of a century"}
  text:
    tr: Karanlıkla açılan ve tek kelime konuşulmadan ilerleyen THRONIVA, bir aile sofrasının etrafında bir yüzyılın başlangıcını çözümlüyor; ışık, geri sayımla yanan ampullerle yavaş yavaş dönüyor.
    de: THRONIVA beginnt in der Dunkelheit und kommt ohne ein einziges Wort aus. Rund um einen Familientisch wird der Beginn eines Jahrhunderts seziert, während das Licht über Glühbirnen, die einen Countdown herunterzählen, allmählich zurückkehrt.
    en: Opening in darkness and unfolding without a single word, THRONIVA dissects the beginning of a century around a family table, as the light slowly returns while bulbs count down.
- slug: fast
  title: FAST
  venue: ballhaus
  form: {tr: Biyografik solo, de: Biografisches Solo, en: Biographical solo}
  text:
    tr: Kamera ve monitörlerle kurulan biyografik bir solo; sahnedeki beden ile ekrandaki görüntüsü arasındaki mesafe, insanın kendi hayatını kendine nasıl anlattığını soruyor.
    de: Ein biografisches Solo mit Kamera und Monitoren, in dem der Abstand zwischen dem Körper auf der Bühne und seinem Bild auf dem Bildschirm danach fragt, wie man sich selbst das eigene Leben erzählt.
    en: A biographical solo with camera and monitors, in which the distance between the body on stage and its image on screen asks how we tell our own lives to ourselves.

# Ağ ve destek projeleri. Bilgisi eksik olanlar soru listesinde.
- slug: right-of-entry
  title: RIGHT OF ENTRY
  year: 2027
  status: soon
  text:
    tr: |
      RIGHT OF ENTRY, hazırlığı süren ve 2027'de başlayacak bir proje. Türkiye'den Berlin'e gelecek sanatçıların yolunu daha Türkiye'deyken açmayı amaçlıyor: ilk temaslar ve tanışmalar orada kurulacak, böylece Berlin'e varıldığında üretim, ağ ve görünürlük için bir zemin hazır olacak.
    de: |
      RIGHT OF ENTRY ist in Vorbereitung und beginnt 2027. Das Projekt will Künstler*innen, die aus der Türkei nach Berlin kommen, den Weg ebnen, solange sie noch in der Türkei sind: Erste Kontakte und Begegnungen entstehen dort, sodass bei der Ankunft in Berlin bereits eine Grundlage für Produktion, Vernetzung und Sichtbarkeit geschaffen ist.
    en: |
      RIGHT OF ENTRY is in preparation and will begin in 2027. It aims to open the way for artists moving from Turkey to Berlin while they are still in Turkey: first contacts and encounters will take place there, so that on arrival in Berlin there is already a foundation for production, networking and visibility.
- slug: mut-zur-buehne
  title: Mut zur Bühne
  year: 2025
  lead: [hazal-erdal]
  funders: [durchstarten]
  text:
    tr: |
      Mut zur Bühne, 2025'te Durchstarten programının desteğiyle hayata geçti ve Hazal Erdal'ın yürütücülüğünde, sahneye çıkmayı isteyip de bunun için bir kapı bulamayanlara yöneldi.
    de: |
      Mut zur Bühne entstand 2025 mit Unterstützung des Programms Durchstarten und richtete sich unter der Leitung von Hazal Erdal an Menschen, die auf die Bühne wollen, aber dafür noch keine Tür gefunden haben.
    en: |
      Mut zur Bühne ran in 2025 with support from the Durchstarten programme and, led by Hazal Erdal, reached out to people who want to be on stage but have not yet found a way in.

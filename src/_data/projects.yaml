# Ağ ve destek projeleri. Bilgisi eksik olanlar soru listesinde.
- slug: mut-zur-buehne
  title: Mut zur Bühne
  year: 2025
  lead: [hazal-erdal]
  funders: [durchstarten]
  text:
    tr: |
      Mut zur Bühne, 2025'te Durchstarten programının desteğiyle hayata geçti ve Hazal Erdal'ın yürütümünde, sahneye çıkmayı isteyip de bunun için bir kapı bulamayanlara yöneldi.
    de: |
      Mut zur Bühne entstand 2025 mit Unterstützung des Programms Durchstarten und richtete sich unter der Leitung von Hazal Erdal an Menschen, die auf die Bühne wollen, aber dafür noch keine Tür gefunden haben.
    en: |
      Mut zur Bühne was realised in 2025 with support from the Durchstarten programme and, led by Hazal Erdal, reached out to people who want to be on stage but have not yet found a way in.
- slug: right-of-entry
  title: RIGHT OF ENTRY
  year: 2026
  text:
    tr: |
      RIGHT OF ENTRY, Türkiye'den Berlin'e gelen sanatçıların yolunu daha Türkiye'deyken açmaya çalışan bir proje: ilk temaslar ve tanışmalar oradayken kuruluyor, Berlin'e varıldığında ise üretim, ağ ve görünürlük için bir zemin hazır bekliyor.
    de: |
      RIGHT OF ENTRY will Künstler*innen, die aus der Türkei nach Berlin kommen, den Weg schon ebnen, solange sie noch in der Türkei sind: Erste Kontakte und Begegnungen entstehen dort, und bei der Ankunft in Berlin wartet bereits ein Boden für Produktion, Vernetzung und Sichtbarkeit.
    en: |
      RIGHT OF ENTRY aims to open the way for artists moving from Turkey to Berlin while they are still in Turkey: first contacts and encounters happen there, so that on arrival in Berlin there is already ground for production, networking and visibility.

tr: Oyunların dışında, Berlin'e yeni gelen sanatçıların yolunu açmak, öğrenmeyi sürdürmek ve birbirimize bağlanmak için projeler yürütüyoruz.
de: Neben den Produktionen entwickeln wir Projekte, die Künstler*innen beim Ankommen in Berlin unterstützen, Lernen ermöglichen und Verbindungen stiften.
en: Beyond the productions, we run projects that help artists arriving in Berlin find their way, keep learning and connect with one another.

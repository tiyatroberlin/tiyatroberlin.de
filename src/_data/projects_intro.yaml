tr: Tiyatro Berlin, oyunların dışında Berlin'e yeni gelen sanatçıların yolunu açan, öğrenmeyi sürdüren ve sanatçıları birbirine bağlayan projeler yürütüyor.
de: Neben den Produktionen entwickelt Tiyatro Berlin Projekte, die Künstler*innen beim Ankommen in Berlin unterstützen, Lernen ermöglichen und Verbindungen stiften.
en: Beyond its productions, Tiyatro Berlin runs projects that help artists arriving in Berlin find their way, keep learning and connect with one another.

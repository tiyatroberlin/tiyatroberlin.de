# Kişi bio'ları. Yalnız onaylı metinler. Bio'su olmayan kişinin sayfasında yalnız işleri görünür.
ufuk-tan-altunkaya:
  role: {tr: Genel sanat yönetmeni, de: Künstlerische Leitung, en: Artistic director}
  tr: |
    Yönetmen, dramaturg ve oyuncu. İstanbul Üniversitesi'nde tiyatro eleştirmenliği ve dramaturji yüksek lisansını tamamladı; Freie Universität Berlin'de 1990 sonrası Türkiye'de tiyatro ve siyaset üzerine doktora yapıyor.

    2010'da İstanbul'da Mekan Artı'nın kuruluşunda yer aldı ve 2017'ye kadar sanat yönetmenliğini yürüttü. Türkiye'de ilk kez denenen tek seyircilik oyunlardan (Takip, üçKİŞİ) Cumartesi Anneleri üzerine Bizde Yok'a, düşünce suçları üzerine Kalem'e uzanan işleri İstanbul Tiyatro Festivali'nde gösterildi. Seyirci ile oyun arasındaki ilişkiyi her işte yeniden kuran mekâna özgü çalışmalarıyla tanınıyor.

    2017'den beri Berlin'de. Theater28 Türk-Alman Tiyatro Festivali'ni yönetti, Ballhaus Prinzenallee'de program hazırladı, Maxim Gorki Theater'da oyuncu olarak çalıştı. 2021'den beri Tiyatro Berlin'in genel sanat yönetmeni.
  de: |
    Regisseur, Dramaturg und Performer. Masterabschluss in Theaterkritik und Dramaturgie an der Universität Istanbul; promoviert an der Freien Universität Berlin über Theater und Politik in der Türkei nach 1990.

    2010 Mitbegründer von Mekan Artı in Istanbul, bis 2017 dessen künstlerischer Leiter. Seine Arbeiten, von den ersten One-on-One-Formaten in der Türkei (Takip, üçKİŞİ) bis zu Bizde Yok über die Samstagsmütter und Kalem über Gesinnungsdelikte, waren beim Internationalen Theaterfestival Istanbul zu sehen. Bekannt für ortsspezifische Arbeiten, die das Verhältnis von Publikum und Spiel jedes Mal neu verhandeln.

    Seit 2017 in Berlin. Leitung des Türkisch-Deutschen Theaterfestivals Theater28, Programmarbeit am Ballhaus Prinzenallee, Schauspiel am Maxim Gorki Theater. Seit 2021 künstlerische Leitung von Tiyatro Berlin.
  en: |
    Director, dramaturg and performer. MA in theatre criticism and dramaturgy at Istanbul University; PhD candidate at Freie Universität Berlin on theatre and politics in Turkey after 1990.

    In 2010 he co-founded Mekan Artı in Istanbul and was its artistic director until 2017. His work, from Turkey's first one-on-one performances (Takip, üçKİŞİ) to Bizde Yok on the Saturday Mothers and Kalem on thought crimes, was shown at the Istanbul Theatre Festival. He is known for site-specific work that renegotiates the relation between audience and performance each time.

    In Berlin since 2017. He directed the Turkish-German theatre festival Theater28, programmed at Ballhaus Prinzenallee and performed at the Maxim Gorki Theater. Artistic director of Tiyatro Berlin since 2021.

hazal-erdal:
  tr: |
    Oyuncu, seslendirme sanatçısı, cast direktörü ve yapımcı. 2004–2009 arasında İstanbul Şehir Tiyatroları'nın Çocuk ve Genç Eğitim Birimlerinde tiyatro eğitimi aldı; 2012–2013'te İstanbul Üniversitesi Devlet Konservatuvarı Müzikal Oyunculuk Bölümü'nde okudu. Atina'daki In.Fo.Ma.T Tiyatro Festivali'ne iki yıl üst üste katıldı.

    Türkiye'de uzun yıllar cast direktörü olarak çalıştı; Devlet Tiyatroları'nda ve özel tiyatrolarda pek çok yapımda oyuncu olarak yer aldı. 1998'den itibaren sinema, reklam ve dizi projelerinde seslendirme sanatçısı olarak çalıştı. Yolo Tiyatro ve Eksi Onaltı Kolektif'te yürütücü yapımcıydı.

    Tiyatro Berlin'de Kozalar ve Pride '93'te oynadı, YAKIN ve The Monologue Box'ta tek başına sahnede; 80'lerde Lubunya Olmak ve SAME'nin proje koordinasyonunu üstlendi. 2025'te Durchstarten desteğiyle Mut zur Bühne projesini yürüttü, 2026'da Proud Haram Festivali'nde Die Reise der Figur durch körperliche Energie atölyesini verdi. Tiyatro Berlin'in oyunculuk atölyesinde eğitmen.
  de: |
    Schauspielerin, Sprecherin, Casting-Direktorin und Produzentin. Theaterausbildung 2004–2009 in den Kinder- und Jugendbildungsabteilungen der Istanbuler Stadttheater, 2012–2013 Studium der Musicaldarstellung am Staatlichen Konservatorium der Universität Istanbul. Zwei Jahre in Folge beim In.Fo.Ma.T Theaterfestival in Athen.

    Arbeitete viele Jahre in der Türkei als Casting-Direktorin und spielte in zahlreichen Produktionen der Staatstheater und privater Bühnen. Ab 1998 Sprecherin für Film, Werbung und Fernsehserien. Ausführende Produzentin bei Yolo Tiyatro und Eksi Onaltı Kolektif.

    Bei Tiyatro Berlin spielte sie in Kozalar und Pride '93, steht in YAKIN und The Monologue Box allein auf der Bühne und übernahm die Produktionsleitung von 80'lerde Lubunya Olmak und SAME. 2025 leitete sie das von Durchstarten geförderte Projekt Mut zur Bühne, 2026 gab sie beim Proud Haram Festival den Workshop Die Reise der Figur durch körperliche Energie. Sie unterrichtet im Schauspielkurs von Tiyatro Berlin.
  en: |
    Actor, voice artist, casting director and producer. She trained in theatre at the children's and youth education units of the Istanbul City Theatres from 2004 to 2009 and studied musical theatre at the Istanbul University State Conservatory in 2012–2013. She took part in the In.Fo.Ma.T Theatre Festival in Athens two years running.

    She worked for many years as a casting director in Turkey and appeared in numerous productions at the State Theatres and independent stages. From 1998 she worked as a voice artist for film, advertising and television series. She was executive producer at Yolo Tiyatro and Eksi Onaltı Kolektif.

    At Tiyatro Berlin she performed in Kozalar and Pride '93, is the sole performer in YAKIN and The Monologue Box, and was production manager of 80'lerde Lubunya Olmak and SAME. In 2025 she led the Durchstarten-funded project Mut zur Bühne; in 2026 she gave the workshop Die Reise der Figur durch körperliche Energie at Proud Haram Festival. She teaches on Tiyatro Berlin's acting course.

egemen-kalyon:
  tr: |
    Dramaturg. İstanbul Üniversitesi mezunu. Mekan Artı yıllarından bu yana aynı ekiple çalışıyor; Tiyatro Berlin'in neredeyse bütün oyunlarının dramaturjisini yaptı. 2024'ten beri Berlin'de.
  de: |
    Dramaturg. Studium an der Universität Istanbul. Arbeitet seit der gemeinsamen Zeit bei Mekan Artı mit demselben Team und war Dramaturg fast aller Produktionen von Tiyatro Berlin. Seit 2024 in Berlin.
  en: |
    Dramaturg, graduate of Istanbul University. He has worked with the same team since the Mekan Artı years and has been dramaturg on almost every Tiyatro Berlin production. Based in Berlin since 2024.

ahmet-ozer:
  tr: |
    Oyuncu. 1998'den beri sahnede. İstanbul'da Mekan Artı'da, İzmir'de Dönüşüm Atölyesi Oyuncuları, İSEM ve Tiyatro Konak'ta çalıştı; Cambazın Cenazesi ile Özdemir Nutku Tiyatro Ödülleri'ne aday gösterildi, Direklerarası'nda Umut Veren Tiyatro ödülünü aldı. 2020'den beri Berlin'de; Ballhaus Prinzenallee'de Migraaaanten'de ve Berliner Ensemble'da Ich habe die Nacht geträumt'ta oynadı.
  de: |
    Schauspieler, seit 1998 auf der Bühne. Engagements bei Mekan Artı in Istanbul sowie bei Dönüşüm Atölyesi Oyuncuları, İSEM und Tiyatro Konak in İzmir; für den Özdemir-Nutku-Theaterpreis nominiert (Cambazın Cenazesi), beim Direklerarası-Preis in der Kategorie Vielversprechende Theaterarbeit ausgezeichnet. Seit 2020 in Berlin; spielte in Migraaaanten am Ballhaus Prinzenallee und in Ich habe die Nacht geträumt am Berliner Ensemble.
  en: |
    Actor, on stage since 1998. He worked with Mekan Artı in Istanbul and with Dönüşüm Atölyesi Oyuncuları, İSEM and Tiyatro Konak in İzmir; nominated for the Özdemir Nutku Theatre Award for Cambazın Cenazesi and honoured at the Direklerarası Awards. In Berlin since 2020, he has performed in Migraaaanten at Ballhaus Prinzenallee and in Ich habe die Nacht geträumt at the Berliner Ensemble.
